experiment_id: HARMONY-FIN-0042
type: intraday_horizon_single_asset
status: preregistered_frozen
strategy_id: horizon_intraday_soxl_v1
objective: "Test a fixed Horizon-style multi-timeframe momentum vote on the 3x semiconductor ETF SOXL using hourly intraday bars."
instrument: SOXL
instrument_description: "Direxion Daily Semiconductor Bull 3X ETF"
signal:
  interval: 1h
  lookbacks_bars: [30, 90, 365]
  interpretation: "long the completed-bar return at each fixed horizon; positive vote when prior close exceeds the close lookback bars earlier"
  vote_rule: "3 positive -> 1.0 exposure; 2 positive -> 2/3 exposure; otherwise 0 exposure"
  long_only: true
  signal_cutoff: "signal at bar t may use closes through t-1 only"
execution:
  order_price: "current bar open"
  overnight: "previous target exposure carries from prior close to current open"
  intrabar: "current target exposure applies from current open to current close"
  end_of_sample: "mark at final close; no discretionary liquidation"
costs:
  primary_fee_rate: 0.0003
  primary_slippage_rate: 0.0002
  stress_multipliers: [1.0, 1.5, 2.0]
data:
  provider: "Yahoo Finance chart API"
  interval: 1h
  regular_session_only: true
  discovery_oos_split: 0.70
  fixed_end_utc: "2026-10-07T00:00:00Z"
  maximum_requested_lookback_days: 720
  provenance: "Direct Yahoo Finance chart endpoint response; raw OHLC is retained with SHA-256."
benchmarks:
  - SOXL_buy_and_hold
  - cash
validation:
  primary: chronological 70/30 OOS
  secondary: cost stress 1.0x/1.5x/2.0x
  integrity:
    - duplicate timestamp rejection
    - monotonic timestamp rejection
    - null OHLC rejection
    - nonpositive price rejection
    - lookahead unit tests
  no_parameter_grid: true
  no_post_hoc_tuning: true
  no_live_trading: true
