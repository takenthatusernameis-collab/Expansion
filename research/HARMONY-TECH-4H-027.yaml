batch_id: HARMONY-TECH-4H-027
status: preregistered_frozen
purpose: "Fast supplementary 4h non-blue-chip technical-indicator/continuation screen using the explicitly fixed 8-asset research basket. This does not replace the long 13-asset batch."
universe:
  assets: [JTOUSDT, PYTHUSDT, WIFUSDT, SEIUSDT, TIAUSDT, ENAUSDT, ORDIUSDT, JUPUSDT]
  exclusions: [BTCUSDT, ETHUSDT, BNBUSDT, SOLUSDT, XRPUSDT, ADAUSDT, DOGEUSDT, LTCUSDT, BCHUSDT]
data:
  source: "Binance USD-M public monthly futures 4h kline archives"
  interval: 4h
  start: "2024-01-01"
  end: "2025-10-31"
indicator_warehouse:
  library: "ta==0.11.0"
  method: "add_all_ta_features"
strategies:
  TC01: trend_reversal_resumption
  TC02: adx_pullback_resumption
  TC03: rsi_trend_recovery
  TC04: macd_histogram_resumption
  TC05: bollinger_midline_reclaim
  TC06: stochastic_trend_recovery
  TC07: donchian_pullback_break
  TC08: keltner_squeeze_resumption
  TC09: aroon_trend_recovery
  TC10: cci_zero_reclaim
execution_accounting:
  signal_timing: "evaluate on completed 4h bar; enter at next 4h bar open"
  normal_exit: "exit at the open of the bar exactly 6 bars after entry"
  stop_loss: false
  take_profit: false
  trailing_stop: false
portfolio_accounting:
  sizing: "fixed 1/N gross slot per asset across the frozen universe; unused slots remain cash"
  gross_exposure_cap: 1.0
  transaction_cost_application: "fee plus slippage multiplied by position weight at each entry and exit; never charged against full portfolio equity per trade"

integrity:
  no_parameter_search: true
  no_universe_search: true
  no_direction_search: true
  no_candidate_mutation: true
  holdout_access_forbidden: true

implementation_integrity:
  corrected_pullback_logic: true
  long_pullback_definition: "close[i-1] < close[i-2]"
  short_pullback_definition: "close[i-1] > close[i-2]"
  note: "The breakout/trigger is evaluated on the current completed bar after the two-bar pullback; the old contradictory condition was removed before corrected re-execution."
