batch_id: HARMONY-DISCOVERY-BATCH-023
status: preregistered_exploratory
purpose: "Bounded external-financial-uncertainty mechanism wave. Positive evidence can enter deep validation but cannot receive guarded promotion until source-vintage/PIT proof exists."
dataset:
  crypto_cache: harmony-binance-um-deep-history-2019-2025-10-v1-36777989764
  uncertainty_gateway: HARMONY-DATA-GATEWAY-007
  universe: [BTCUSDT, ETHUSDT, LTCUSDT, XRPUSDT, BNBUSDT, BCHUSDT, ADAUSDT, DOGEUSDT]
  discovery_end: "2024-05-31"
  oos_start: "2024-06-01"
  end: "2025-10-31"
  beta_window_months: 24
  minimum_beta_observations: 18
schedule: monthly
costs:
  fee_rate: 0.0006
  slippage_rate: 0.0005
cheap_gate:
  minimum_rebalances: 18
  minimum_cumulative_return_after_costs: 0.0
  minimum_sharpe_after_costs: 0.0
  rank_metric: discovery_sharpe_2x_cost
  deep_capacity: 2
deep_gate:
  oos_1x_sharpe_minimum: 0.75
  oos_2x_sharpe_minimum: 0.50
  both_oos_halves_positive: true
promotion:
  guarded: false
  blocked_until: "HARMONY-DATA-GATEWAY-007 vintage/PIT certificate"
candidates:
  FIN-0115:
    mechanism: low_finu_beta
    fixed_definition: "At each month-end, 24-month OLS beta of monthly crypto return to monthly log change in LMNUF12M; long lowest 3 beta / short highest 3 beta."
    external_evidence: "Financial uncertainty and the cross-section of cryptocurrency returns, Journal of Banking & Finance 2026, DOI 10.1016/j.jbankfin.2026.107717"
  FIN-0116:
    mechanism: finu_beta_instability
    fixed_definition: "Absolute difference between current 24-month FINU beta and the immediately preceding 24-month beta; long lowest 3 instability / short highest 3."
    external_evidence: "Financial uncertainty and the cross-section of cryptocurrency returns, Journal of Banking & Finance 2026, DOI 10.1016/j.jbankfin.2026.107717"
  FIN-0117:
    mechanism: positive_finu_shock_beta
    fixed_definition: "24-month beta estimated only on months with positive FINU shocks; long lowest 3 / short highest 3."
    external_evidence: "Financial uncertainty and the cross-section of cryptocurrency returns, Journal of Banking & Finance 2026, DOI 10.1016/j.jbankfin.2026.107717"
  FIN-0118:
    mechanism: finu_beta_x_crypto_volatility
    fixed_definition: "Current 24-month FINU beta multiplied by trailing 12-month monthly crypto return volatility; long lowest 3 / short highest 3."
    external_evidence: "Financial uncertainty and the cross-section of cryptocurrency returns, Journal of Banking & Finance 2026, DOI 10.1016/j.jbankfin.2026.107717"
  FIN-0119:
    mechanism: finu_beta_trend
    fixed_definition: "Slope of the 6 most recent monthly 24-month FINU beta estimates; long lowest 3 / short highest 3."
    external_evidence: "Financial uncertainty and the cross-section of cryptocurrency returns, Journal of Banking & Finance 2026, DOI 10.1016/j.jbankfin.2026.107717"
integrity:
  no_parameter_search: true
  no_universe_search: true
  no_direction_search: true
  no_candidate_mutation: true
  holdout_access_forbidden: true
  benchmark_relative_diagnostics_required: true
