protocol_id: HARMONY-HOLDOUT-PROTOCOL-003
version: "1.0"
status: preregistered_future_holdout
purpose: >-
  Accrue the preregistered funding-carry holdout continuously from already-elapsed daily
  data. No month-end waiting is permitted; each completed day is materialized immediately.
selection_boundary:
  end: "2025-10-31"
family:
  campaign: HARMONY-CAMPAIGN-001
  candidates:
    - funding_carry_mean_1d_weekly_v1
    - funding_carry_mean_3d_weekly_v1
    - funding_carry_mean_7d_weekly_v1
    - funding_carry_zscore_7d_weekly_v1
future_tail:
  start: "2026-09-01"
  minimum_common_observations_before_release: 180
  release_rule: >-
    Freeze the first contiguous common-date segment beginning 2026-09-01 that reaches
    at least 180 observations, using complete daily price data and native Binance
    funding-rate history sourced through the preregistered source ladder.
source_ladder:
  price:
    - "Binance futures UM daily klines"
  funding:
    - "Primit public historical funding gateway sourcing Binance data"
integrity:
  local_sha256_required: true
  raw_funding_response_sha256_required: true
  source_request_scope_required: true
  complete_8_symbol_panel_required: true
  contiguous_start_required: true
execution:
  all_four_candidates_required: true
  no_parameter_search: true
  no_universe_search: true
  automatic_cost_stress: [1.0,1.5,2.0]
  automatic_benchmarks:
    - same_universe_equal_weight_long_only
    - BTCUSDT_buy_and_hold
release:
  results_enter_selection_state: false
  results_become_historical_evidence_only: true
  holdout_cannot_trigger_candidate_mutation: true

parallel_research_firewall:
  principle: >-
    The 180-observation future-holdout gate controls release and execution of this frozen
    funding-carry holdout only. It is not a global research lock.
  allowed_while_accruing:
    - acquire_and_fingerprint_pre_holdout_history
    - run_independent_historical_discovery_on_data_ending_2025-10-31_or_earlier
    - preregister_structurally_distinct_candidate_families
    - validate_methodology_and_research_infrastructure
  prohibited_while_accruing:
    - consume_2026-09-01_or_later_holdout_observations_for_selection
    - mutate_the_frozen_four_candidate_family
    - treat_unreleased_holdout_results_as_selection_evidence
  future_holdout_results_remain_firewalled_until_release_reconciliation: true
