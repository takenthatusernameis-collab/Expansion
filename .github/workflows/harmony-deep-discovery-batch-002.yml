name: Harmony deep discovery batch 002

on:
  push:
    paths:
      - "experiments/HARMONY-FIN-0017.yaml"
      - "experiments/HARMONY-FIN-0018.yaml"
      - "experiments/run_harmony_deep_discovery_batch_002.py"
      - "research/HARMONY-DEEP-DISCOVERY-BATCH-002.yaml"
      - "tests/test_deep_discovery_batch_002.py"
      - ".github/workflows/harmony-deep-discovery-batch-002.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deep-discovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore verified futures deep-history cache
        uses: actions/cache/restore@v4
        with:
          path: data/cache/binance/futures_um/deep_history_2019
          key: harmony-binance-um-deep-history-2019-2025-10-v1-36777989764
          fail-on-cache-miss: true

      - name: Restore reusable spot deep-history cache
        id: spot-cache
        uses: actions/cache/restore@v4
        with:
          path: data/cache/binance/spot/deep_history_2019
          key: harmony-binance-spot-deep-history-2019-2025-10-v1
          fail-on-cache-miss: false

      - name: Restore reusable CFTC COT cache
        id: cot-cache
        uses: actions/cache/restore@v4
        with:
          path: data/cache/cftc/cot_legacy
          key: harmony-cftc-cot-legacy-2017-2025-v1
          fail-on-cache-miss: false

      - name: Install test runner
        run: python -m pip install --disable-pip-version-check --no-input pytest

      - name: Validate deep-batch components
        run: python -m pytest -q tests/test_deep_discovery_batch_002.py

      - name: Execute the two frozen deep tests
        run: python experiments/run_harmony_deep_discovery_batch_002.py

      - name: Save spot deep-history cache
        if: success() && steps.spot-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: data/cache/binance/spot/deep_history_2019
          key: harmony-binance-spot-deep-history-2019-2025-10-v1

      - name: Save CFTC COT cache
        if: success() && steps.cot-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: data/cache/cftc/cot_legacy
          key: harmony-cftc-cot-legacy-2017-2025-v1

      - name: Upload deep-batch evidence
        uses: actions/upload-artifact@v4
        with:
          name: harmony-deep-discovery-batch-002
          path: artifacts/HARMONY-DEEP-DISCOVERY-BATCH-002
          if-no-files-found: error
          retention-days: 90
