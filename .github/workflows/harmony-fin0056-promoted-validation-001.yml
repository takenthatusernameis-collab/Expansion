name: Harmony FIN-0056 promoted robustness validation 001

on:
  push:
    paths:
      - "research/HARMONY-FIN-0056-PROMOTED-VALIDATION-001.yaml"
      - "experiments/run_harmony_fin0056_promoted_validation_001.py"
      - "tests/test_harmony_fin0056_promoted_validation_001.py"
      - ".github/workflows/harmony-fin0056-promoted-validation-001.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore verified futures deep-history cache
        uses: actions/cache/restore@v4
        with:
          path: data/cache/binance/futures_um/deep_history_2019
          key: harmony-binance-um-deep-history-2019-2025-10-v1-36777989764
          fail-on-cache-miss: true
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check --no-input pytest
      - name: Validate fixed validation runner
        run: python -m pytest -q tests/test_harmony_fin0056_promoted_validation_001.py
      - name: Execute FIN-0056 fixed-definition robustness validation
        run: python experiments/run_harmony_fin0056_promoted_validation_001.py
      - name: Upload validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: harmony-fin0056-promoted-validation-001
          path: artifacts/HARMONY-FIN-0056-PROMOTED-VALIDATION-001
          if-no-files-found: error
          retention-days: 90
