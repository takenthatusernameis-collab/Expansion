name: Harmony external data gateway 007

on:
  push:
    branches:
      - "research/grind-2026-10-01-batch023"
    paths:
      - "research/HARMONY-DATA-GATEWAY-007.yaml"
      - "data_sources/harmony_data_gateway_007.py"
      - "experiments/run_harmony_data_gateway_007.py"
      - "tests/test_harmony_data_gateway_007.py"
      - ".github/workflows/harmony-data-gateway-007.yml"

permissions:
  contents: write

jobs:
  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/grind-2026-10-01-batch023
      - name: Install runtime
        run: python -m pip install --disable-pip-version-check --no-input pytest
      - name: Validate gateway
        run: python -m pytest -q tests/test_harmony_data_gateway_007.py
      - name: Materialize external uncertainty data
        run: python experiments/run_harmony_data_gateway_007.py
      - uses: actions/upload-artifact@v4
        with:
          name: harmony-data-gateway-007
          path: artifacts/HARMONY-DATA-GATEWAY-007
          if-no-files-found: error
          retention-days: 90
      - name: Persist normalized uncertainty store
        run: |
          git config user.name "harmony-actions"
          git config user.email "harmony-actions@users.noreply.github.com"
          git add data/cache/harmony_gateway_v7 artifacts/HARMONY-DATA-GATEWAY-007/HARMONY-DATA-GATEWAY-007-RESULT.json
          git diff --cached --quiet || (git commit -m "Persist gateway 007 uncertainty feature store" && git push)
