name: Harmony SOXL intraday Horizon 001

on:
  push:
    branches:
      - research/harmony-soxl-intraday-horizon-001
    paths-ignore:
      - "results/harmony_soxl_intraday_horizon_0042/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: harmony-soxl-intraday-horizon-001
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas pyyaml pytest

      - name: Test strategy primitives
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_harmony_soxl_intraday_horizon_0042.py

      - name: Execute frozen research
        run: |
          PYTHONPATH=. python experiments/harmony_soxl_intraday_horizon_0042.py

      - name: Verify result artifact
        run: |
          test -s results/harmony_soxl_intraday_horizon_0042/results.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("results/harmony_soxl_intraday_horizon_0042/results.json")
          x = json.loads(p.read_text())
          assert x["experiment_id"] == "HARMONY-FIN-0042"
          assert x["status"] == "EXECUTED"
          assert x["data"]["content_sha256"]
          assert x["oos"]["trades"] >= 0
          print("artifact verification: PASS")
          PY

      - name: Persist results
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/harmony_soxl_intraday_horizon_0042
          git commit -m "results: execute HARMONY-FIN-0042 SOXL intraday Horizon research" || true
          git push origin "HEAD:${{ github.ref_name }}"
