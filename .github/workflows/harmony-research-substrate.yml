name: Harmony research substrate validation

on:
  push:
    paths:
      - "research/HARMONY-RESEARCH-SUBSTRATE-001.yaml"
      - "research/campaigns/**"
      - "src/harmony_backtest/archive_materializer.py"
      - "tests/test_archive_materializer.py"
      - "experiments/HARMONY-CAMPAIGN-001.yaml"
      - ".github/workflows/harmony-research-substrate.yml"
  pull_request:
    paths:
      - "research/HARMONY-RESEARCH-SUBSTRATE-001.yaml"
      - "research/campaigns/**"
      - "src/harmony_backtest/archive_materializer.py"
      - "tests/test_archive_materializer.py"
      - "experiments/HARMONY-CAMPAIGN-001.yaml"

permissions:
  contents: read

jobs:
  substrate:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check --no-input pytest
      - name: Run substrate and campaign tests
        run: python -m pytest -q tests/test_archive_materializer.py tests/test_data.py tests/test_experiment.py
