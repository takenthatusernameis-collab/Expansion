name: Harmony external data gateway 005

on:
  push:
    branches:
      - "research/grind-2026-10-01-batch020"
    paths:
      - "research/HARMONY-DATA-GATEWAY-005.yaml"
      - "data_sources/harmony_data_gateway_005.py"
      - "experiments/run_harmony_data_gateway_005.py"
      - "tests/test_harmony_data_gateway_005.py"
      - ".github/workflows/harmony-data-gateway-005.yml"

permissions:
  contents: write

jobs:
  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/grind-2026-10-01-batch020
      - uses: actions/cache/restore@v4
        with:
          path: data/cache/harmony_gateway_v5/realized_2h
          key: harmony-data-gateway-005-v1
      - name: Install runtime
        run: python -m pip install --disable-pip-version-check --no-input pytest
      - name: Validate gateway
        run: python -m pytest -q tests/test_harmony_data_gateway_005.py
      - name: Materialize fixed 2h archive
        run: python experiments/run_harmony_data_gateway_005.py
      - uses: actions/cache/save@v4
        with:
          path: data/cache/harmony_gateway_v5/realized_2h
          key: harmony-data-gateway-005-v1
      - name: Upload gateway evidence
        uses: actions/upload-artifact@v4
        with:
          name: harmony-data-gateway-005
          path: artifacts/HARMONY-DATA-GATEWAY-005
          if-no-files-found: error
          retention-days: 90
      - name: Publish compact gateway proof
        run: |
          mkdir -p research/execution_results
          cp artifacts/HARMONY-DATA-GATEWAY-005/HARMONY-DATA-GATEWAY-005-RESULT.json research/execution_results/HARMONY-DATA-GATEWAY-005.json
          git config user.name "harmony-actions"
          git config user.email "harmony-actions@users.noreply.github.com"
          git add research/execution_results/HARMONY-DATA-GATEWAY-005.json
          git diff --cached --quiet || (git commit -m "Publish gateway 005 proof" && git push)
