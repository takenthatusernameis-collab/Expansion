name: Harmony promoted-candidate robustness validation 001

on:
  push:
    paths:
      - "research/HARMONY-PROMOTED-VALIDATION-001.yaml"
      - "experiments/run_harmony_promoted_validation_001.py"
      - "tests/test_harmony_promoted_validation_001.py"
      - ".github/workflows/harmony-promoted-validation-001.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore FIN-0012 monthly cache
        uses: actions/cache/restore@v4
        with:
          path: data/cache/binance/futures_um/monthly
          key: harmony-binance-um-2021-01-2025-10-v4
          fail-on-cache-miss: true
      - name: Restore deep-history cache for FIN-0024
        uses: actions/cache/restore@v4
        with:
          path: data/cache/binance/futures_um/deep_history_2019
          key: harmony-binance-um-deep-history-2019-2025-10-v1-36777989764
          fail-on-cache-miss: true
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check --no-input pytest
      - name: Validate runner
        run: python -m pytest -q tests/test_harmony_promoted_validation_001.py
      - name: Execute fixed-definition robustness validation
        run: python experiments/run_harmony_promoted_validation_001.py
      - name: Upload validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: harmony-promoted-validation-001
          path: artifacts/HARMONY-PROMOTED-VALIDATION-001
          if-no-files-found: error
          retention-days: 90
