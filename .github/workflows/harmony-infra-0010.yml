name: Harmony sealed final holdout data materialization

on:
  push:
    paths:
      - "experiments/HARMONY-HOLDOUT-DATA-001.yaml"
      - "experiments/run_harmony_holdout_data_001.py"
      - ".github/workflows/harmony-infra-0010.yml"

permissions:
  contents: read
  actions: write

jobs:
  holdout-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore holdout cache
        uses: actions/cache/restore@v4
        with:
          path: data/cache/binance/futures_um/holdout_2025-11_2026-08
          key: harmony-binance-um-holdout-2025-11-2026-08-v3

      - name: Materialize and fingerprint sealed holdout
        run: python experiments/run_harmony_holdout_data_001.py

      - name: Save clean holdout cache
        uses: actions/cache/save@v4
        if: success()
        with:
          path: data/cache/binance/futures_um/holdout_2025-11_2026-08
          key: harmony-binance-um-holdout-2025-11-2026-08-v3

      - name: Upload sealed holdout audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harmony-holdout-data-001-audit
          path: artifacts/HARMONY-HOLDOUT-DATA-001
          if-no-files-found: error
          retention-days: 90

