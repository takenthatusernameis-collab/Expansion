name: Harmony FIN-0007 lower-turnover breakout proximity OOS

on:
  push:
    paths:
      - "experiments/HARMONY-FIN-0007.yaml"
      - ".github/workflows/harmony-fin-0007.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore verified USD-M price and funding archives
        uses: actions/cache@v4
        with:
          path: data/cache/binance/futures_um/monthly
          key: harmony-binance-um-2021-01-2025-10-v4
          fail-on-cache-miss: true

      - name: Execute preregistered FIN-0007
        run: |
          python - <<'PY'
          import csv, hashlib, io, json, math, statistics, zipfile
          from datetime import datetime, timezone
          from pathlib import Path

          S=["BTCUSDT","ETHUSDT","LTCUSDT","XRPUSDT","BNBUSDT","BCHUSDT","ADAUSDT","DOGEUSDT"]
          ROOT=Path("data/cache/binance/futures_um/monthly")
          FEE=0.0006
          SLIP=0.0005
          COST=FEE+SLIP
          REBALANCE_EVERY=7
          OUT=Path("artifacts/HARMONY-FIN-0007")
          GROSS_MIN=0.25
          GROSS_SHARPE_MIN=0.75
          TURNOVER_MAX=0.125

          def day(ms):
              return datetime.fromtimestamp(ms/1000,timezone.utc).date().isoformat()

          def months():
              z=[]
              y,m=2021,1
              while (y,m)<=(2025,10):
                  z.append((y,m))
                  m+=1
                  if m==13:
                      y,m=y+1,1
              return z

          def csvrows(p):
              with zipfile.ZipFile(p) as z:
                  names=[n for n in z.namelist() if n.lower().endswith(".csv")]
                  if len(names)!=1:
                      raise RuntimeError(f"bad archive: {p}")
                  return list(csv.reader(io.StringIO(z.read(names[0]).decode("utf-8"))))

          px={s:{} for s in S}
          rawfd={s:[] for s in S}
          cache_hashes=[]

          for s in S:
              for y,m in months():
                  kp=ROOT/"klines"/s/"1d"/f"{s}-1d-{y:04d}-{m:02d}.zip"
                  fp=ROOT/"fundingRate"/s/f"{s}-fundingRate-{y:04d}-{m:02d}.zip"
                  for p in (kp,fp):
                      data=p.read_bytes()
                      cache_hashes.append((str(p),hashlib.sha256(data).hexdigest(),len(data)))
                  for r in csvrows(kp):
                      if r and r[0].isdigit():
                          px[s][day(int(r[0]))]=float(r[4])
                  rr=csvrows(fp)
                  h={k.strip():i for i,k in enumerate(rr[0])}
                  required={"calc_time","funding_interval_hours","last_funding_rate"}
                  if not required.issubset(h):
                      raise RuntimeError(f"funding schema mismatch: {fp}")
                  for r in rr[1:]:
                      if r:
                          rawfd[s].append((
                              int(r[h["calc_time"]]),
                              int(float(r[h["funding_interval_hours"]])),
                              float(r[h["last_funding_rate"]])
                          ))

          dates=sorted(set.intersection(*(set(px[s]) for s in S)))
          assert len(dates)==1760 and dates[0]=="2021-01-01" and dates[-1]=="2025-10-31"

          funding={s:{} for s in S}
          for s in S:
              for ts,interval,rate in rawfd[s]:
                  funding[s].setdefault(day(ts),[]).append((interval,rate))

          split=math.floor(len(dates)*0.70)
          oos=dates[split:]
          assert len(oos)==528 and oos[-1]=="2025-10-31"

          def target(i):
              if i<61:
                  return {s:0.0 for s in S}
              signal_date=dates[i-1]
              lookback=dates[i-61:i-1]
              assert len(lookback)==60
              scores=[]
              for s in S:
                  prior_high=max(px[s][d] for d in lookback)
                  score=px[s][signal_date]/prior_high-1.0
                  scores.append((score,s))
              scores.sort(key=lambda z:(z[0],z[1]))
              w={s:0.0 for s in S}
              for _,s in scores[-2:]:
                  w[s]=0.25
              for _,s in scores[:2]:
                  w[s]=-0.25
              return w

          def run(start,mode):
              eq_net=1.0
              eq_gross=1.0
              prev={s:0.0 for s in S}
              net_curve=[]
              gross_curve=[]
              funding_sum=0.0
              funding_events=0
              cost_sum=0.0
              turnover=0.0

              for i in range(start,len(dates)):
                  d=dates[i]

                  for s in S:
                      for interval,rate in funding[s].get(d,[]):
                          eq_net*=1-prev[s]*rate
                          eq_gross*=1-prev[s]*rate
                          funding_sum+=-prev[s]*rate
                          funding_events+=1

                  if i>start:
                      pd=dates[i-1]
                      gross=sum(prev[s]*(px[s][d]/px[s][pd]-1.0) for s in S)
                      eq_net*=1+gross
                      eq_gross*=1+gross

                  if mode=="strategy":
                      tgt=target(i) if ((i-start)%REBALANCE_EVERY==0) else prev.copy()
                  elif mode=="equal_weight":
                      tgt={s:1/len(S) for s in S} if ((i-start)%REBALANCE_EVERY==0) else prev.copy()
                  elif mode=="btc":
                      tgt={s:(1.0 if s=="BTCUSDT" else 0.0) for s in S} if ((i-start)%REBALANCE_EVERY==0) else prev.copy()
                  else:
                      raise ValueError(mode)

                  delta=sum(abs(tgt[s]-prev[s]) for s in S)
                  turnover+=delta/2.0
                  cost_sum+=COST*delta
                  eq_net*=1-COST*delta

                  net_curve.append(eq_net)
                  gross_curve.append(eq_gross)
                  prev=tgt

              liq=sum(abs(v) for v in prev.values())
              eq_net*=1-COST*liq
              eq_gross_final=eq_gross
              net_curve[-1]=eq_net

              def metrics(curve):
                  rr=[curve[i]/curve[i-1]-1.0 for i in range(1,len(curve))]
                  sd=statistics.stdev(rr) if len(rr)>1 else 0.0
                  sharpe=(statistics.mean(rr)/sd)*math.sqrt(365.25) if sd else 0.0
                  peak=curve[0]
                  mdd=0.0
                  for x in curve:
                      peak=max(peak,x)
                      mdd=min(mdd,x/peak-1.0)
                  cagr=curve[-1]**(365.25/max(1,len(curve)-1))-1.0
                  return {
                      "final_equity":curve[-1],
                      "cumulative_return":curve[-1]-1.0,
                      "cagr":cagr,
                      "max_drawdown":mdd,
                      "sharpe":sharpe,
                      "observations":len(curve)
                  }

              return {
                  "gross_pre_transaction_cost":metrics(gross_curve),
                  "net_after_transaction_cost":metrics(net_curve),
                  "total_one_way_turnover":turnover,
                  "mean_daily_one_way_turnover":turnover/len(net_curve),
                  "total_transaction_cost_fraction":cost_sum+COST*liq,
                  "funding_events":funding_events,
                  "funding_pnl_sum":funding_sum
              }

          strategy=run(split,"strategy")
          equal_weight=run(split,"equal_weight")
          btc=run(split,"btc")

          gates={
              "gross_cumulative_return":strategy["gross_pre_transaction_cost"]["cumulative_return"]>=GROSS_MIN,
              "gross_sharpe":strategy["gross_pre_transaction_cost"]["sharpe"]>=GROSS_SHARPE_MIN,
              "mean_daily_one_way_turnover":strategy["mean_daily_one_way_turnover"]<=TURNOVER_MAX
          }
          gates_pass=all(gates.values())

          digest_input="\n".join(f"{p}|{n}|{z}" for p,n,z in sorted(cache_hashes)).encode()
          cache_manifest_sha256=hashlib.sha256(digest_input).hexdigest()

          OUT.mkdir(parents=True,exist_ok=True)
          result={
              "experiment_id":"HARMONY-FIN-0007",
              "strategy_id":"cross_sectional_60d_breakout_proximity_weekly",
              "data":{
                  "source":"Binance USD-M Futures monthly 1d klines + monthly fundingRate archives",
                  "panel_rows":len(dates),
                  "panel_start":dates[0],
                  "panel_end":dates[-1],
                  "oos_rows":len(oos),
                  "oos_start":oos[0],
                  "oos_end":oos[-1],
                  "symbols":S,
                  "cache_key":"harmony-binance-um-2021-01-2025-10-v4",
                  "cache_manifest_sha256":cache_manifest_sha256,
                  "cache_file_count":len(cache_hashes)
              },
              "configuration":{
                  "signal":"close(t-1) / max(close(t-61:t-2)) - 1",
                  "lookback_days":60,
                  "rebalance_every_oos_observations":REBALANCE_EVERY,
                  "portfolio":"long top 2 +0.25 each; short bottom 2 -0.25 each",
                  "signal_cutoff":"t-1 close",
                  "fee_rate":FEE,
                  "slippage_rate":SLIP,
                  "funding":"native settlement timestamps and native intervals",
                  "terminal_liquidation":True,
                  "parameters_fit_on_oos":False,
                  "no_parameter_grid":True
              },
              "oos_strategy":strategy,
              "benchmarks":{
                  "equal_weight":equal_weight,
                  "btc_buy_and_hold":btc
              },
              "comparisons":{
                  "net_strategy_minus_equal_weight_cumulative_return":
                      strategy["net_after_transaction_cost"]["cumulative_return"]-equal_weight["net_after_transaction_cost"]["cumulative_return"],
                  "net_strategy_minus_btc_cumulative_return":
                      strategy["net_after_transaction_cost"]["cumulative_return"]-btc["net_after_transaction_cost"]["cumulative_return"]
              },
              "preregistered_gates":{
                  "thresholds":{
                      "gross_cumulative_return_min":GROSS_MIN,
                      "gross_sharpe_min":GROSS_SHARPE_MIN,
                      "mean_daily_one_way_turnover_max":TURNOVER_MAX
                  },
                  "observed":{
                      "gross_cumulative_return":strategy["gross_pre_transaction_cost"]["cumulative_return"],
                      "gross_sharpe":strategy["gross_pre_transaction_cost"]["sharpe"],
                      "mean_daily_one_way_turnover":strategy["mean_daily_one_way_turnover"]
                  },
                  "checks":gates,
                  "all_pass":gates_pass
              },
              "integrity":{
                  "fixed_universe":True,
                  "prior_only_price_signal":True,
                  "native_funding_timestamps_used":True,
                  "no_forward_fill":True,
                  "no_universe_search":True,
                  "no_post_convergence_optimization":True,
                  "prior_experiments_modified":False,
                  "verified_cache_reused":True
              }
          }
          (OUT/"result.json").write_text(json.dumps(result,indent=2,sort_keys=True)+"\n")
          print(json.dumps(result,indent=2,sort_keys=True))
          PY

      - name: Upload FIN-0007 evidence
        uses: actions/upload-artifact@v4
        with:
          name: harmony-fin-0007-evidence
          path: artifacts/HARMONY-FIN-0007
          if-no-files-found: error
          retention-days: 90
