name: Harmony future holdout continuous elapsed accrual

on:
  schedule:
    - cron: "37 5 * * *"
  push:
    paths:
      - "research/HARMONY-HOLDOUT-PROTOCOL-003.yaml"
      - "experiments/run_harmony_future_holdout_003.py"
      - ".github/workflows/harmony-future-holdout-003.yml"
      - "tests/test_future_holdout_003.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  future-holdout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore elapsed historical cache
        uses: actions/cache/restore@v4
        with:
          path: data/cache/binance/futures_um/elapsed_history_2026-09-daily-v5
          key: harmony-elapsed-history-2026-09-daily-v5
          restore-keys: |
            harmony-elapsed-history-2026-09-daily-v5-
      - name: Run continuous holdout regression tests
        run: |
          python -m pip install pytest
          PYTHONPATH=src pytest -q tests/test_future_holdout_003.py
      - name: Accrue elapsed history and gate future holdout
        run: python experiments/run_harmony_future_holdout_003.py
      - name: Save elapsed holdout cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: data/cache/binance/futures_um/elapsed_history_2026-09-daily-v5
          key: harmony-elapsed-history-2026-09-daily-v5-${{ github.run_id }}
      - name: Upload holdout accrual evidence
        uses: actions/upload-artifact@v4
        with:
          name: harmony-future-holdout-003
          path: artifacts/HARMONY-FUTURE-HOLDOUT-003
          if-no-files-found: error
          retention-days: 90
