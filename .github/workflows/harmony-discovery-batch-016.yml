name: Harmony discovery batch 016

on:
  push:
    paths:
      - "research/HARMONY-DISCOVERY-BATCH-016.yaml"
      - "experiments/run_harmony_discovery_batch_016.py"
      - "tests/test_harmony_discovery_batch_016.py"
      - ".github/workflows/harmony-discovery-batch-016.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discovery:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: data/cache/harmony_gateway_v2
          key: harmony-data-gateway-002-v1
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: data/cache/binance/futures_um/deep_history_2019
          key: harmony-binance-um-deep-history-2019-2025-10-v1-36777989764
          fail-on-cache-miss: true
      - name: Install runtime
        run: python -m pip install --disable-pip-version-check --no-input pytest numpy
      - name: Validate frozen batch
        run: python -m pytest -q tests/test_harmony_discovery_batch_016.py
      - name: Execute cheap screen and conditional deep gate
        run: python experiments/run_harmony_discovery_batch_016.py
      - name: Upload batch evidence
        uses: actions/upload-artifact@v4
        with:
          name: harmony-discovery-batch-016
          path: artifacts/HARMONY-DISCOVERY-BATCH-016
          if-no-files-found: error
          retention-days: 90
      - name: Publish compact execution proof
        run: |
          mkdir -p research/execution_results
          cp artifacts/HARMONY-DISCOVERY-BATCH-016/SUMMARY.json research/execution_results/HARMONY-DISCOVERY-BATCH-016.json
          git config user.name "harmony-actions"
          git config user.email "harmony-actions@users.noreply.github.com"
          git add research/execution_results/HARMONY-DISCOVERY-BATCH-016.json
          git diff --cached --quiet || (git commit -m "Publish batch 016 proof" && git push)
