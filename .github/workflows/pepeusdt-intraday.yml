name: HARMONY PEPEUSDT intraday session backtest

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pepeusdt-intraday.yml"
      - "research/pepeusdt_session/run_backtest.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: harmony-pepe-session-001
  cancel-in-progress: false

jobs:
  backtest:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the frozen research specification and runner
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.1.3 pandas==2.2.3 pandas-market-calendars==4.4.2

      - name: Execute frozen backtest
        id: backtest_run
        continue-on-error: true
        run: python research/pepeusdt_session/run_backtest.py build/pepeusdt-session-001

      - name: Preserve full run package including market data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harmony-pepe-session-001-run-package
          path: build/pepeusdt-session-001/
          if-no-files-found: warn
          retention-days: 90

      - name: Persist readout and reproducibility outputs to Expansion
        if: always()
        run: |
          set -eu
          mkdir -p research/results/HARMONY-PEPE-SESSION-001
          for name in report.md summary.json manifest.json daily_returns.csv trades.csv metrics.csv calendar_year_metrics.csv benchmark_daily_returns.csv; do
            if [ -f "build/pepeusdt-session-001/$name" ]; then
              cp "build/pepeusdt-session-001/$name" "research/results/HARMONY-PEPE-SESSION-001/$name"
            fi
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/results/HARMONY-PEPE-SESSION-001
          if ! git diff --cached --quiet; then
            git commit -m "Persist HARMONY PEPE session backtest results"
            git push
          else
            echo "No generated result files to commit."
          fi

      - name: Fail the workflow if the backtest failed
        if: steps.backtest_run.outcome == 'failure'
        run: exit 1
