name: Harmony FIN-0024 Durability Audit 001

on:
  push:
    paths:
      - "research/HARMONY-FIN-0024-DURABILITY-001.yaml"
      - "experiments/run_harmony_fin0024_durability_001.py"
      - ".github/workflows/harmony-fin0024-durability-001.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  durability:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - name: Restore verified futures deep-history cache
        uses: actions/cache/restore@v4
        with:
          path: data/cache/binance/futures_um/deep_history_2019
          key: harmony-binance-um-deep-history-2019-2025-10-v1-36777989764
          fail-on-cache-miss: true
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check --no-input pytest
      - name: Validate durability runner
        run: python -m pytest -q tests/test_harmony_fin0024_durability_001.py
      - name: Execute fixed-definition durability audit
        run: python experiments/run_harmony_fin0024_durability_001.py
      - name: Upload durability evidence
        uses: actions/upload-artifact@v4
        with:
          name: harmony-fin-0024-durability-001
          path: artifacts/HARMONY-FIN-0024-DURABILITY-001
          if-no-files-found: error
          retention-days: 90
      - name: Publish compact execution proof
        run: |
          mkdir -p research/execution_results
          cp artifacts/HARMONY-FIN-0024-DURABILITY-001/SUMMARY.json research/execution_results/HARMONY-FIN-0024-DURABILITY-001.json
          git config user.name "harmony-actions"
          git config user.email "harmony-actions@users.noreply.github.com"
          git add research/execution_results/HARMONY-FIN-0024-DURABILITY-001.json
          git diff --cached --quiet || (git commit -m "Publish FIN-0024 durability proof" && git push)
