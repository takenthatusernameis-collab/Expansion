name: Harmony Acceleration Leader 001

on:
  push:
    branches:
      - research/harmony-accel-leader-001
    paths:
      - "experiments/HARMONY-ACCEL-LEADER-001.yaml"
      - "experiments/run_harmony_accel_leader_001.py"
      - "tests/test_harmony_accel_leader_001.py"
      - "prompts/harmony_accel_leader_001.md"
      - ".github/workflows/harmony-acceleration-leader-001.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harmony-acceleration-leader-001
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Check out the preregistered research branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned research dependencies
        run: python -m pip install --disable-pip-version-check --no-input numpy==2.1.3 pandas==2.2.3 pytest==8.3.4

      - name: Compile runner and verify signal, stop, freshness, and execution semantics
        run: |
          python -m py_compile experiments/run_harmony_accel_leader_001.py tests/test_harmony_accel_leader_001.py
          python -m pytest -q tests/test_harmony_accel_leader_001.py

      - name: Run the fixed acceleration-leader experiment
        id: run_research
        continue-on-error: true
        run: python experiments/run_harmony_accel_leader_001.py

      - name: Preserve research report, normalized candles, ledgers, and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harmony-accel-leader-001-evidence
          path: artifacts/HARMONY-ACCEL-LEADER-001/
          if-no-files-found: warn
          retention-days: 90

      - name: Fail if the research runner failed technically
        if: steps.run_research.outcome == 'failure'
        run: exit 1
