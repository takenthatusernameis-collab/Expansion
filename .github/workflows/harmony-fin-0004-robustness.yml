name: Harmony FIN-0004 independent robustness validation

on:
  push:
    paths:
      - "experiments/HARMONY-FIN-0004.yaml"
      - ".github/workflows/harmony-fin-0004-robustness.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore verified USD-M price and funding archives
        uses: actions/cache@v4
        with:
          path: data/cache/binance/futures_um/monthly
          key: harmony-binance-um-2021-01-2025-10-v4
          fail-on-cache-miss: true

      - name: Independently reconstruct and stress frozen FIN-0004
        run: |
          python - <<'PY'
          import csv,io,json,math,statistics,zipfile
          from datetime import datetime,timezone
          from pathlib import Path

          S=["BTCUSDT","ETHUSDT","LTCUSDT","XRPUSDT","BNBUSDT","BCHUSDT","ADAUSDT","DOGEUSDT"]
          ROOT=Path("data/cache/binance/futures_um/monthly")
          BASE_COST=.0011
          TARGET_EQUITY=1.5310618203335344
          TOL=1e-12

          def day(ms):
              return datetime.fromtimestamp(ms/1000,timezone.utc).date().isoformat()

          def months():
              z=[];y,m=2021,1
              while (y,m)<=(2025,10):
                  z.append((y,m));m+=1
                  if m==13:y,m=y+1,1
              return z

          def rows(p):
              with zipfile.ZipFile(p) as z:
                  ns=[n for n in z.namelist() if n.lower().endswith(".csv")]
                  if len(ns)!=1:raise RuntimeError(f"bad archive: {p}")
                  return list(csv.reader(io.StringIO(z.read(ns[0]).decode("utf-8"))))

          def load():
              px={s:{} for s in S}; fd={s:[] for s in S}
              for s in S:
                  for y,m in months():
                      kp=ROOT/"klines"/s/"1d"/f"{s}-1d-{y:04d}-{m:02d}.zip"
                      fp=ROOT/"fundingRate"/s/f"{s}-fundingRate-{y:04d}-{m:02d}.zip"
                      for r in rows(kp):
                          if r and r[0].isdigit():px[s][day(int(r[0]))]=float(r[4])
                      rr=rows(fp)
                      header=rr[0]
                      idx={name.strip():i for i,name in enumerate(header)}
                      for r in rr[1:]:
                          if not r:continue
                          fd[s].append((int(r[idx["calc_time"]]),int(float(r[idx["funding_interval_hours"]])),
                                       float(r[idx["last_funding_rate"]])))
              common=set.intersection(*(set(px[s]) for s in S))
              dates=sorted(common)
              assert len(dates)==1760 and dates[0]=="2021-01-01" and dates[-1]=="2025-10-31"
              return dates,px,fd

          def beta(x,y):
              mx,my=statistics.mean(x),statistics.mean(y)
              den=sum((v-my)**2 for v in y)
              return sum((a-mx)*(b-my) for a,b in zip(x,y))/den if den else 0.0

          def wgt(dates,px,i):
              if i<61:return {s:0.0 for s in S}
              p=dates[i-1];a=dates[i-21]
              br=[px["BTCUSDT"][dates[j]]/px["BTCUSDT"][dates[j-1]]-1 for j in range(i-60,i)]
              out=[]
              b20=px["BTCUSDT"][p]/px["BTCUSDT"][a]-1
              for s in S:
                  ar=[px[s][dates[j]]/px[s][dates[j-1]]-1 for j in range(i-60,i)]
                  sc=px[s][p]/px[s][a]-1-beta(ar,br)*b20
                  out.append((sc,s))
              out.sort(key=lambda z:(-z[0],z[1]))
              w={s:0.0 for s in S}
              for _,s in out[:2]:w[s]=.25
              for _,s in out[-2:]:w[s]=-.25
              return w

          def run(dates,px,fd,start,cost_mult=1.0,use_funding=True):
              by={s:{} for s in S}
              for s in S:
                  for ts,interval,rate in fd[s]:
                      by[s].setdefault(day(ts),[]).append((interval,rate))
              eq=1.0;prev={s:0.0 for s in S};curve=[];funding_pnl=0.0;events=0;costs=0.0
              for i in range(start,len(dates)):
                  d=dates[i]
                  if use_funding:
                      for s in S:
                          for interval,rate in by[s].get(d,[]):
                              eq*=1-prev[s]*rate
                              funding_pnl+=-prev[s]*rate
                              events+=1
                  if i>start:
                      pd=dates[i-1]
                      gross=sum(prev[s]*(px[s][d]/px[s][pd]-1) for s in S)
                      eq*=1+gross
                  tgt=wgt(dates,px,i)
                  delta=sum(abs(tgt[s]-prev[s]) for s in S)
                  c=BASE_COST*cost_mult*delta
                  eq*=1-c;costs+=c
                  curve.append(eq);prev=tgt
              liq=sum(abs(v) for v in prev.values())
              eq*=1-BASE_COST*cost_mult*liq
              curve[-1]=eq;costs+=BASE_COST*cost_mult*liq
              rr=[curve[i]/curve[i-1]-1 for i in range(1,len(curve))]
              sd=statistics.stdev(rr) if len(rr)>1 else 0
              sh=(statistics.mean(rr)/sd)*math.sqrt(365) if sd else 0
              peak=curve[0];mdd=0
              for x in curve:
                  peak=max(peak,x);mdd=min(mdd,x/peak-1)
              cagr=curve[-1]**(365.25/max(1,len(curve)-1))-1
              return {"final_equity":eq,"cumulative_return":eq-1,"cagr":cagr,"sharpe":sh,
                      "max_drawdown":mdd,"funding_events":events,"funding_pnl_sum":funding_pnl,
                      "transaction_cost_fraction":costs,"curve":curve}

          dates,px,fd=load()
          split=math.floor(len(dates)*.70)
          oos=dates[split:]
          base=run(dates,px,fd,split,1.0,True)
          recon_diff=abs(base["final_equity"]-TARGET_EQUITY)

          costs={}
          for mult in (1.0,1.5,2.0):
              r=run(dates,px,fd,split,mult,True)
              costs[f"{mult:.1f}x"]={k:v for k,v in r.items() if k!="curve"}

          no_funding=run(dates,px,fd,split,1.0,False)

          curve=base["curve"]
          edges=[round(i*len(curve)/6) for i in range(7)]
          blocks=[]
          for b in range(6):
              a,z=edges[b],edges[b+1]
              start_eq=curve[a-1] if a else 1.0
              blocks.append({
                  "block":b+1,
                  "start":oos[a],
                  "end":oos[z-1],
                  "observations":z-a,
                  "cumulative_return":curve[z-1]/start_eq-1
              })

          result={
              "experiment_id":"HARMONY-INFRA-0011",
              "validation_of":"HARMONY-FIN-0004",
              "oos_period":[oos[0],oos[-1]],
              "independent_reconstruction":{
                  "recomputed_final_equity":base["final_equity"],
                  "original_final_equity":TARGET_EQUITY,
                  "absolute_difference":recon_diff,
                  "within_tolerance":recon_diff<=TOL,
                  "tolerance":TOL
              },
              "cost_stress":costs,
              "funding_ablation":{
                  "baseline_cumulative_return":base["cumulative_return"],
                  "no_funding_cumulative_return":no_funding["cumulative_return"],
                  "difference":base["cumulative_return"]-no_funding["cumulative_return"],
                  "baseline_funding_events":base["funding_events"],
                  "baseline_funding_pnl_sum":base["funding_pnl_sum"]
              },
              "temporal_blocks":{
                  "block_count":6,
                  "positive_blocks":sum(x["cumulative_return"]>0 for x in blocks),
                  "all_positive":all(x["cumulative_return"]>0 for x in blocks),
                  "min_block_return":min(x["cumulative_return"] for x in blocks),
                  "max_block_return":max(x["cumulative_return"] for x in blocks),
                  "blocks":blocks
              },
              "integrity":{
                  "same_fixed_universe":True,
                  "same_signal_definition":True,
                  "same_oos_protocol":True,
                  "same_base_cost":True,
                  "parameters_not_optimized":True,
                  "no_new_candidates":True,
                  "native_funding_timestamps":True
              }
          }

          out=Path("artifacts/HARMONY-INFRA-0011");out.mkdir(parents=True,exist_ok=True)
          (out/"validation.json").write_text(json.dumps(result,indent=2,sort_keys=True)+"\n")
          print(json.dumps(result,indent=2,sort_keys=True))
          PY

      - name: Upload FIN-0004 robustness evidence
        uses: actions/upload-artifact@v4
        with:
          name: harmony-infra-0011
          path: artifacts/HARMONY-INFRA-0011
          if-no-files-found: error
          retention-days: 90
