name: Harmony FIN-0005 independent reconstruction

on:
  push:
    paths:
      - "experiments/HARMONY-FIN-0005.yaml"
      - ".github/workflows/harmony-fin-0005-reconstruction.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore verified USD-M price and funding archives
        uses: actions/cache@v4
        with:
          path: data/cache/binance/futures_um/monthly
          key: harmony-binance-um-2021-01-2025-10-v4
          fail-on-cache-miss: true

      - name: Independently reconstruct FIN-0005
        run: |
          python - <<'PY'
          import csv,io,json,math,statistics,zipfile
          from datetime import datetime,timezone
          from pathlib import Path

          SYMS=["BTCUSDT","ETHUSDT","LTCUSDT","XRPUSDT","BNBUSDT","BCHUSDT","ADAUSDT","DOGEUSDT"]
          ROOT=Path("data/cache/binance/futures_um/monthly")
          TARGET=0.6585855919365639
          TOL=1e-12
          COST=.0011

          def d(ms):
              return datetime.fromtimestamp(ms/1000,timezone.utc).date().isoformat()
          def months():
              z=[];y,m=2021,1
              while(y,m)<=(2025,10):
                  z.append((y,m));m+=1
                  if m==13:y,m=y+1,1
              return z
          def csvrows(p):
              with zipfile.ZipFile(p) as z:
                  n=[x for x in z.namelist() if x.lower().endswith(".csv")][0]
                  return list(csv.reader(io.StringIO(z.read(n).decode("utf-8"))))
          px={s:{} for s in SYMS}; fund={s:[] for s in SYMS}
          for s in SYMS:
              for y,m in months():
                  kp=ROOT/"klines"/s/"1d"/f"{s}-1d-{y:04d}-{m:02d}.zip"
                  fp=ROOT/"fundingRate"/s/f"{s}-fundingRate-{y:04d}-{m:02d}.zip"
                  for r in csvrows(kp):
                      if r and r[0].isdigit():px[s][d(int(r[0]))]=float(r[4])
                  rr=csvrows(fp); h={k.strip():i for i,k in enumerate(rr[0])}
                  for r in rr[1:]:
                      if r:fund[s].append((int(r[h["calc_time"]]),float(r[h["last_funding_rate"]])))
          common=sorted(set.intersection(*(set(px[s]) for s in SYMS)))
          assert len(common)==1760 and common[0]=="2021-01-01" and common[-1]=="2025-10-31"
          split=math.floor(len(common)*.70); oos=common[split:]
          fd={s:{} for s in SYMS}
          for s in SYMS:
              for ts,rate in fund[s]:fd[s].setdefault(d(ts),[]).append(rate)

          eq=1.; prev={s:0. for s in SYMS}; curve=[]
          for i in range(split,len(common)):
              day=common[i]
              for s in SYMS:
                  for rate in fd[s].get(day,[]):eq*=1-prev[s]*rate
              if i>split:
                  pd=common[i-1]
                  eq*=1+sum(prev[s]*(px[s][day]/px[s][pd]-1) for s in SYMS)
              score_day=common[i-1] if i>0 else common[i]
              scores=sorted((statistics.mean(fd[s][score_day]),s) for s in SYMS)
              tgt={s:0. for s in SYMS}
              for _,s in scores[:2]:tgt[s]=.25
              for _,s in scores[-2:]:tgt[s]=-.25
              delta=sum(abs(tgt[s]-prev[s]) for s in SYMS)
              eq*=1-COST*delta
              curve.append(eq);prev=tgt
          eq*=1-COST*sum(abs(v) for v in prev.values())
          curve[-1]=eq

          r=[curve[i]/curve[i-1]-1 for i in range(1,len(curve))]
          sd=statistics.stdev(r) if len(r)>1 else 0.
          sharpe=(statistics.mean(r)/sd)*math.sqrt(365) if sd else 0.
          peak=curve[0];mdd=0.
          for x in curve:
              peak=max(peak,x);mdd=min(mdd,x/peak-1)
          result={
              "experiment_id":"HARMONY-INFRA-0012",
              "validation_of":"HARMONY-FIN-0005",
              "independent_reconstruction":{
                  "recomputed_final_equity":eq,
                  "original_final_equity":TARGET,
                  "absolute_difference":abs(eq-TARGET),
                  "within_tolerance":abs(eq-TARGET)<=TOL,
                  "tolerance":TOL
              },
              "oos":{
                  "start":oos[0],"end":oos[-1],"rows":len(oos),
                  "cumulative_return":eq-1,
                  "sharpe":sharpe,
                  "max_drawdown":mdd
              },
              "integrity":{
                  "fixed_universe":True,
                  "same_signal_definition":True,
                  "same_oos_protocol":True,
                  "same_costs":True,
                  "native_funding_timestamps":True,
                  "parameters_not_optimized":True,
                  "no_new_candidates":True
              }
          }
          out=Path("artifacts/HARMONY-INFRA-0012");out.mkdir(parents=True,exist_ok=True)
          (out/"validation.json").write_text(json.dumps(result,indent=2,sort_keys=True)+"\n")
          print(json.dumps(result,indent=2,sort_keys=True))
          PY

      - name: Upload FIN-0005 reconstruction
        uses: actions/upload-artifact@v4
        with:
          name: harmony-infra-0012
          path: artifacts/HARMONY-INFRA-0012
          if-no-files-found: error
          retention-days: 90
