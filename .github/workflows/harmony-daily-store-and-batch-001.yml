name: Harmony daily store and shared discovery batch 001

on:
  push:
    paths:
      - "src/harmony_backtest/daily_store.py"
      - "src/harmony_backtest/batch_engine.py"
      - "experiments/materialize_harmony_daily_store_001.py"
      - "experiments/run_harmony_discovery_batch_001.py"
      - "tests/test_daily_store.py"
      - "tests/test_batch_engine.py"
      - "research/HARMONY-RESEARCH-SUBSTRATE-002.yaml"
      - "research/HARMONY-CHEAP-SCREEN-001.yaml"
      - ".github/workflows/harmony-daily-store-and-batch-001.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  validate-materialize-batch:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
      RAW_CACHE_KEY: harmony-binance-um-deep-history-2019-2025-10-v1-36777989764
      STORE_CACHE_KEY: harmony-daily-store-8sym-v1-2026-10-01-r1
      STORE_PATH: data/cache/research/daily_8sym_v1.csv.gz
      STORE_MANIFEST: data/cache/research/daily_8sym_v1.csv.gz.manifest.json
    steps:
      - uses: actions/checkout@v4

      - name: Restore verified raw deep-history cache
        uses: actions/cache/restore@v4
        with:
          path: data/cache/binance/futures_um/deep_history_2019
          key: ${{ env.RAW_CACHE_KEY }}
          fail-on-cache-miss: true

      - name: Restore normalized daily-store cache
        id: store-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            data/cache/research/daily_8sym_v1.csv.gz
            data/cache/research/daily_8sym_v1.csv.gz.manifest.json
          key: ${{ env.STORE_CACHE_KEY }}
          fail-on-cache-miss: false

      - name: Install test runner
        run: python -m pip install --disable-pip-version-check --no-input pytest

      - name: Validate deterministic shared components
        run: python -m pytest -q tests/test_daily_store.py tests/test_batch_engine.py

      - name: Validate or materialize normalized daily store
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "$STORE_PATH" ] && [ -f "$STORE_MANIFEST" ]; then
            python -c "import hashlib,json; from pathlib import Path; s=Path('data/cache/research/daily_8sym_v1.csv.gz'); m=json.loads(Path('data/cache/research/daily_8sym_v1.csv.gz.manifest.json').read_text()); a=hashlib.sha256(s.read_bytes()).hexdigest(); e=m['store_sha256']; assert a==e, 'normalized store SHA mismatch'; print('verified cached normalized store:', a)"
          else
            python experiments/materialize_harmony_daily_store_001.py
          fi

      - name: Run compute-amortized discovery batch
        run: python experiments/run_harmony_discovery_batch_001.py

      - name: Save normalized daily-store cache
        if: success() && steps.store-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            data/cache/research/daily_8sym_v1.csv.gz
            data/cache/research/daily_8sym_v1.csv.gz.manifest.json
          key: ${{ env.STORE_CACHE_KEY }}

      - name: Upload normalized-store and batch evidence
        uses: actions/upload-artifact@v4
        with:
          name: harmony-daily-store-and-batch-001
          path: |
            artifacts/HARMONY-DAILY-STORE-001
            artifacts/HARMONY-DISCOVERY-BATCH-001
          if-no-files-found: error
          retention-days: 90
