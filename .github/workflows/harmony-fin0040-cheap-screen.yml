name: Harmony FIN-0040 cheap screen

on:
  push:
    paths:
      - "research/HARMONY-FIN-0040.yaml"
      - "research/HARMONY-CHEAP-SCREEN-FIN-0040-001.yaml"
      - "experiments/run_harmony_fin0040_cheap_screen.py"
      - "tests/test_fin0040_cheap_screen.py"
      - ".github/workflows/harmony-fin0040-cheap-screen.yml"
  pull_request:
    paths:
      - "research/HARMONY-FIN-0040.yaml"
      - "research/HARMONY-CHEAP-SCREEN-FIN-0040-001.yaml"
      - "experiments/run_harmony_fin0040_cheap_screen.py"
      - "tests/test_fin0040_cheap_screen.py"
      - ".github/workflows/harmony-fin0040-cheap-screen.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cheap-screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore verified futures deep-history cache
        uses: actions/cache/restore@v4
        with:
          path: data/cache/binance/futures_um/deep_history_2019
          key: harmony-binance-um-deep-history-2019-2025-10-v1-36777989764
          fail-on-cache-miss: true
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check --no-input pytest
      - name: Validate cheap-screen components
        run: python -m pytest -q tests/test_fin0040_cheap_screen.py
      - name: Execute FIN-0040 discovery-only cheap screen
        run: python experiments/run_harmony_fin0040_cheap_screen.py
      - name: Upload cheap-screen evidence
        uses: actions/upload-artifact@v4
        with:
          name: harmony-cheap-screen-fin0040-001
          path: artifacts/HARMONY-CHEAP-SCREEN-FIN-0040-001
          if-no-files-found: error
          retention-days: 90
