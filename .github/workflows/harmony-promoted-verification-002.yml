name: Harmony promoted verification 002

on:
  push:
    paths:
      - "research/HARMONY-PROMOTED-VERIFICATION-002.yaml"
      - "experiments/run_harmony_promoted_verification_002.py"
      - "tests/test_harmony_promoted_verification_002.py"
      - ".github/workflows/harmony-promoted-verification-002.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore FIN-0012 monthly cache
        uses: actions/cache/restore@v4
        with:
          path: data/cache/binance/futures_um/monthly
          key: harmony-binance-um-2021-01-2025-10-v4
          fail-on-cache-miss: true
      - name: Restore deep-history cache
        uses: actions/cache/restore@v4
        with:
          path: data/cache/binance/futures_um/deep_history_2019
          key: harmony-binance-um-deep-history-2019-2025-10-v1-36777989764
          fail-on-cache-miss: true
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check --no-input pytest
      - name: Run tests
        run: python -m pytest -q tests/test_harmony_promoted_verification_002.py tests/test_harmony_promoted_validation_001.py
      - name: Execute independent verification
        run: python experiments/run_harmony_promoted_verification_002.py
      - name: Upload verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: harmony-promoted-verification-002
          path: artifacts/HARMONY-PROMOTED-VERIFICATION-002
          if-no-files-found: error
          retention-days: 90
      - name: Publish compact execution proof
        run: |
          mkdir -p research/execution_results
          cp artifacts/HARMONY-PROMOTED-VERIFICATION-002/SUMMARY.json research/execution_results/HARMONY-PROMOTED-VERIFICATION-002.json
          git config user.name "harmony-actions"
          git config user.email "harmony-actions@users.noreply.github.com"
          git add research/execution_results/HARMONY-PROMOTED-VERIFICATION-002.json
          git diff --cached --quiet || (git commit -m "Publish promoted verification 002 proof" && git push)
