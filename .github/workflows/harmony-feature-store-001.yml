name: Harmony persistent feature store 001

on:
  push:
    paths:
      - "src/harmony_backtest/feature_store.py"
      - "tests/test_feature_store.py"
      - "experiments/materialize_harmony_feature_store_001.py"
      - ".github/workflows/harmony-feature-store-001.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  feature-store:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check --no-input pytest
      - name: Run feature-store tests
        run: python -m pytest -q tests/test_feature_store.py
      - name: Restore verified long-history USD-M dataset
        uses: actions/cache/restore@v4
        with:
          path: data/cache/binance/futures_um/monthly
          key: harmony-binance-um-2021-01-2025-10-v4
          fail-on-cache-miss: true
      - name: Materialize deterministic feature store
        run: python experiments/materialize_harmony_feature_store_001.py
      - name: Save persistent feature cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: data/cache/features/funding_carry_v1
          key: harmony-feature-store-funding-carry-v1-2026-09-30-r1
      - name: Upload feature-store evidence
        uses: actions/upload-artifact@v4
        with:
          name: harmony-feature-store-001
          path: artifacts/HARMONY-FEATURE-STORE-001
          if-no-files-found: error
          retention-days: 90
