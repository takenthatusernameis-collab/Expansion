name: Harmony external data gateway 006

on:
  push:
    branches:
      - "research/grind-2026-10-01-batch022"
    paths:
      - "research/HARMONY-DATA-GATEWAY-006.yaml"
      - "data_sources/harmony_data_gateway_006.py"
      - "experiments/run_harmony_data_gateway_006.py"
      - "tests/test_harmony_data_gateway_006.py"
      - ".github/workflows/harmony-data-gateway-006.yml"

permissions:
  contents: write

jobs:
  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/grind-2026-10-01-batch022
      - name: Install runtime
        run: python -m pip install --disable-pip-version-check --no-input pytest
      - name: Validate gateway
        run: python -m pytest -q tests/test_harmony_data_gateway_006.py
      - name: Materialize fixed 4h flow archive
        run: python experiments/run_harmony_data_gateway_006.py
      - uses: actions/upload-artifact@v4
        with:
          name: harmony-data-gateway-006
          path: artifacts/HARMONY-DATA-GATEWAY-006
          if-no-files-found: error
          retention-days: 90
      - name: Persist normalized flow store
        run: |
          git config user.name "harmony-actions"
          git config user.email "harmony-actions@users.noreply.github.com"
          git add data/cache/harmony_gateway_v6/flow_4h artifacts/HARMONY-DATA-GATEWAY-006/HARMONY-DATA-GATEWAY-006-RESULT.json
          git diff --cached --quiet || (git commit -m "Persist gateway 006 flow feature store" && git push)
