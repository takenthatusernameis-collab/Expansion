name: Harmony 4h non-blue-chip Z-score cointegration stat-arb 026

on:
  push:
    branches:
      - "research/grind-2026-10-01-statarb"
    paths:
      - "research/HARMONY-STATARB-4H-026.yaml"
      - "experiments/run_harmony_statarb_4h_026.py"
      - "tests/test_harmony_statarb_4h_026.py"
      - ".github/workflows/harmony-statarb-4h-026.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: harmony-statarb-4h-026
  cancel-in-progress: true

jobs:
  statarb:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/grind-2026-10-01-statarb
      - uses: actions/cache/restore@v4
        with:
          path: data/cache/harmony_gateway_v8/raw_4h
          key: harmony-tech-4h-025-raw-v1
      - name: Install runtime
        run: python -m pip install --disable-pip-version-check --no-input pytest pandas==2.2.3 statsmodels==0.15.0
      - name: Validate stat-arb infrastructure
        run: python -m pytest -q tests/test_harmony_statarb_4h_026.py
      - name: Run cointegration, z-score and statistical-arbitrage tests
        run: python experiments/run_harmony_statarb_4h_026.py
      - uses: actions/upload-artifact@v4
        with:
          name: harmony-statarb-4h-026
          path: artifacts/HARMONY-STATARB-4H-026
          if-no-files-found: error
          retention-days: 90
      - name: Publish stat-arb proof
        run: |
          mkdir -p research/execution_results
          cp artifacts/HARMONY-STATARB-4H-026/SUMMARY.json research/execution_results/HARMONY-STATARB-4H-026.json
          cp artifacts/HARMONY-STATARB-4H-026/HARMONY-STATARB-4H-026-RESULT.json research/execution_results/HARMONY-STATARB-4H-026-RESULT.json
          cp artifacts/HARMONY-STATARB-4H-026/COINTEGRATION-DIAGNOSTICS.json research/execution_results/HARMONY-STATARB-4H-026-COINTEGRATION-DIAGNOSTICS.json
          git config user.name "harmony-actions"
          git config user.email "harmony-actions@users.noreply.github.com"
          git add research/execution_results/HARMONY-STATARB-4H-026.json research/execution_results/HARMONY-STATARB-4H-026-RESULT.json research/execution_results/HARMONY-STATARB-4H-026-COINTEGRATION-DIAGNOSTICS.json
          git diff --cached --quiet || (git commit -m "Publish non-blue-chip stat-arb proof" && git push)
