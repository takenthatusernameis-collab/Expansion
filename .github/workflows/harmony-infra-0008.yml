name: Harmony FIN-0003 robustness validation

on:
  push:
    paths:
      - "experiments/HARMONY-FIN-0003.yaml"
      - "experiments/validate_harmony_fin_0003.py"
      - ".github/workflows/harmony-infra-0008.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore verified multi-asset archive cache
        uses: actions/cache@v4
        with:
          path: data/cache/binance/spot/monthly/klines_1d
          key: harmony-binance-spot-1d-2021-01-2025-10-v1
          fail-on-cache-miss: true

      - name: Run independent robustness validation
        run: python experiments/validate_harmony_fin_0003.py

      - name: Upload validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: harmony-infra-0008
          path: artifacts/HARMONY-INFRA-0008
          if-no-files-found: error
          retention-days: 90
