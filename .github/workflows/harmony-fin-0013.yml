name: Harmony FIN-0013 time-series momentum

on:
  push:
    paths:
      - "experiments/HARMONY-FIN-0013.yaml"
      - "experiments/run_harmony_fin_0013.py"
      - "tests/test_fin_0013.py"
      - "research/HARMONY-FIN-0013-BINDING.json"
      - ".github/workflows/harmony-fin-0013.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore immutable FIN-0013 input cache
        uses: actions/cache/restore@v4
        with:
          path: data/cache/binance/futures_um/deep_history_2019
          key: harmony-binance-um-deep-history-2019-2025-10-v1-36777989764
          fail-on-cache-miss: true

      - name: Deterministic fixture tests
        run: python -m unittest tests/test_fin_0013.py

      - name: Execute single frozen candidate
        run: python experiments/run_harmony_fin_0013.py

      - name: Upload immutable FIN-0013 evidence
        uses: actions/upload-artifact@v4
        with:
          name: harmony-fin-0013
          path: artifacts/HARMONY-FIN-0013
          if-no-files-found: error
          retention-days: 90
