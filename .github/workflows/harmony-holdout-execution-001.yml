name: Harmony sealed final holdout execution

on:
  push:
    paths:
      - "experiments/run_harmony_holdout_execution_001.py"
      - ".github/workflows/harmony-holdout-execution-001.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  holdout-execution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore verified selection cache
        uses: actions/cache/restore@v4
        with:
          path: data/cache/binance/futures_um/monthly
          key: harmony-binance-um-2021-01-2025-10-v4
          fail-on-cache-miss: true

      - name: Restore sealed holdout cache
        uses: actions/cache/restore@v4
        with:
          path: data/cache/binance/futures_um/holdout_2025-11_2026-08
          key: harmony-binance-um-holdout-2025-11-2026-08-v4
          fail-on-cache-miss: false

      - name: Execute frozen frontier
        run: python experiments/run_harmony_holdout_execution_001.py

      - name: Save clean execution cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: data/cache/binance/futures_um/holdout_2025-11_2026-08
          key: harmony-binance-um-holdout-2025-11-2026-08-v4

      - name: Upload sealed execution evidence
        uses: actions/upload-artifact@v4
        with:
          name: harmony-holdout-execution-001
          path: artifacts/HARMONY-HOLDOUT-EXECUTION-001
          if-no-files-found: error
          retention-days: 90
