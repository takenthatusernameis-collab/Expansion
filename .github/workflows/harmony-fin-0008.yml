name: Harmony FIN-0008 fixed multi-asset TSMOM OOS

on:
  push:
    paths:
      - "experiments/HARMONY-FIN-0008.yaml"
      - "experiments/HARMONY-FIN-0008-AMENDMENT-001.yaml"
      - ".github/workflows/harmony-fin-0008.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore verified USD-M price and funding archives
        uses: actions/cache@v4
        with:
          path: data/cache/binance/futures_um/monthly
          key: harmony-binance-um-2021-01-2025-10-v4
          fail-on-cache-miss: true

      - name: Execute preregistered FIN-0008
        run: |
          python - <<'PY'
          import csv, hashlib, io, json, math, statistics, zipfile
          from datetime import datetime, timezone
          from pathlib import Path

          S = ["BTCUSDT","ETHUSDT","LTCUSDT","XRPUSDT","BNBUSDT","BCHUSDT","ADAUSDT","DOGEUSDT"]
          ROOT = Path("data/cache/binance/futures_um/monthly")
          FEE = 0.0006
          SLIP = 0.0005
          REBALANCE_EVERY = 7
          LOOKBACK_DAYS = 20
          OUT = Path("artifacts/HARMONY-FIN-0008")

          def day(ms):
              return datetime.fromtimestamp(ms/1000, timezone.utc).date().isoformat()

          def months():
              out = []
              y, m = 2021, 1
              while (y, m) <= (2025, 10):
                  out.append((y, m))
                  m += 1
                  if m == 13:
                      y, m = y + 1, 1
              return out

          def rows(path):
              with zipfile.ZipFile(path) as z:
                  names = [n for n in z.namelist() if n.lower().endswith(".csv")]
                  if len(names) != 1:
                      raise RuntimeError(f"unexpected archive members: {path}")
                  return list(csv.reader(io.StringIO(z.read(names[0]).decode("utf-8"))))

          px = {s: {} for s in S}
          raw_funding = {s: [] for s in S}
          cache_hashes = []

          for s in S:
              for y, m in months():
                  kp = ROOT / "klines" / s / "1d" / f"{s}-1d-{y:04d}-{m:02d}.zip"
                  fp = ROOT / "fundingRate" / s / f"{s}-fundingRate-{y:04d}-{m:02d}.zip"
                  for p in (kp, fp):
                      b = p.read_bytes()
                      cache_hashes.append((str(p), hashlib.sha256(b).hexdigest(), len(b)))
                  for r in rows(kp):
                      if r and r[0].isdigit():
                          px[s][day(int(r[0]))] = float(r[4])
                  rr = rows(fp)
                  h = {k.strip(): i for i, k in enumerate(rr[0])}
                  required = {"calc_time", "funding_interval_hours", "last_funding_rate"}
                  if not required.issubset(h):
                      raise RuntimeError(f"funding schema mismatch: {fp}")
                  for r in rr[1:]:
                      if r:
                          raw_funding[s].append((
                              int(r[h["calc_time"]]),
                              int(float(r[h["funding_interval_hours"]])),
                              float(r[h["last_funding_rate"]])
                          ))

          dates = sorted(set.intersection(*(set(px[s]) for s in S)))
          assert len(dates) == 1760 and dates[0] == "2021-01-01" and dates[-1] == "2025-10-31"
          split = math.floor(len(dates) * 0.70)
          oos = dates[split:]
          assert len(oos) == 528 and oos[-1] == "2025-10-31"

          funding = {s: {} for s in S}
          for s in S:
              for ts, interval, rate in raw_funding[s]:
                  funding[s].setdefault(day(ts), []).append((interval, rate))

          def target(i):
              if i < LOOKBACK_DAYS + 1:
                  return {s: 0.0 for s in S}
              signal_date = dates[i - 1]
              prior_date = dates[i - LOOKBACK_DAYS - 1]
              w = {s: 0.0 for s in S}
              active = [s for s in S if px[s][signal_date] / px[s][prior_date] - 1.0 > 0.0]
              if active:
                  weight = 1.0 / len(active)
                  for s in active:
                      w[s] = weight
              return w

          def metrics(curve):
              rr = [curve[i] / curve[i-1] - 1.0 for i in range(1, len(curve))]
              sd = statistics.stdev(rr) if len(rr) > 1 else 0.0
              sharpe = (statistics.mean(rr) / sd) * math.sqrt(365.25) if sd else 0.0
              peak = curve[0]
              mdd = 0.0
              for x in curve:
                  peak = max(peak, x)
                  mdd = min(mdd, x / peak - 1.0)
              cagr = curve[-1] ** (365.25 / max(1, len(curve)-1)) - 1.0
              return {
                  "final_equity": curve[-1],
                  "cumulative_return": curve[-1] - 1.0,
                  "cagr": cagr,
                  "max_drawdown": mdd,
                  "sharpe": sharpe,
                  "observations": len(curve)
              }

          def simulate(start, end, mode, cost_mult=1.0, apply_funding=True):
              eq = 1.0
              prev = {s: 0.0 for s in S}
              curve = []
              turnover = 0.0
              cost_sum = 0.0
              funding_sum = 0.0
              funding_events = 0

              for i in range(start, end):
                  d = dates[i]

                  if apply_funding:
                      for s in S:
                          for interval, rate in funding[s].get(d, []):
                              eq *= 1.0 - prev[s] * rate
                              funding_sum += -prev[s] * rate
                              funding_events += 1

                  if i > start:
                      pd = dates[i-1]
                      daily_ret = sum(prev[s] * (px[s][d] / px[s][pd] - 1.0) for s in S)
                      eq *= 1.0 + daily_ret

                  rebalance = ((i - start) % REBALANCE_EVERY == 0)
                  if rebalance:
                      if mode == "strategy":
                          tgt = target(i)
                      elif mode == "equal_weight":
                          tgt = {s: 1.0 / len(S) for s in S}
                      elif mode == "btc":
                          tgt = {s: (1.0 if s == "BTCUSDT" else 0.0) for s in S}
                      else:
                          raise ValueError(mode)
                  else:
                      tgt = prev.copy()

                  delta = sum(abs(tgt[s] - prev[s]) for s in S)
                  turnover += delta / 2.0
                  cost = (FEE + SLIP) * cost_mult * delta
                  eq *= 1.0 - cost
                  cost_sum += cost

                  prev = tgt
                  curve.append(eq)

              liquidation = sum(abs(v) for v in prev.values())
              liq_cost = (FEE + SLIP) * cost_mult * liquidation
              eq *= 1.0 - liq_cost
              cost_sum += liq_cost
              curve[-1] = eq

              return {
                  "metrics": metrics(curve),
                  "one_way_turnover": turnover,
                  "mean_daily_one_way_turnover": turnover / len(curve),
                  "transaction_cost_fraction": cost_sum,
                  "funding_pnl_sum": funding_sum,
                  "funding_events": funding_events
              }

          def run_halves(start, end, cost_mult=1.0):
              n = end - start
              mid = start + n // 2
              return {
                  "first_half": simulate(start, mid, "strategy", cost_mult),
                  "second_half": simulate(mid, end, "strategy", cost_mult)
              }

          base = simulate(split, len(dates), "strategy", 1.0)
          benchmark_equal = simulate(split, len(dates), "equal_weight", 1.0)
          benchmark_btc = simulate(split, len(dates), "btc", 1.0)

          cost_stress = {
              f"{mult:.1f}x": simulate(split, len(dates), "strategy", mult)["metrics"]
              for mult in (1.0, 1.5, 2.0)
          }
          halves = run_halves(split, len(dates), 1.0)

          cache_manifest_sha256 = hashlib.sha256(
              "\n".join(f"{p}|{n}|{z}" for p, n, z in sorted(cache_hashes)).encode()
          ).hexdigest()

          result = {
              "experiment_id": "HARMONY-FIN-0008",
              "strategy_id": "multi_asset_tsmom_20d_long_flat_weekly_v1",
              "data": {
                  "cache_key": "harmony-binance-um-2021-01-2025-10-v4",
                  "cache_manifest_sha256": cache_manifest_sha256,
                  "cache_file_count": len(cache_hashes),
                  "panel_rows": len(dates),
                  "panel_start": dates[0],
                  "panel_end": dates[-1],
                  "oos_rows": len(oos),
                  "oos_start": oos[0],
                  "oos_end": oos[-1],
                  "symbols": S
              },
              "configuration": {
                  "lookback_days": LOOKBACK_DAYS,
                  "signal": "close(t-1) / close(t-21) - 1",
                  "signal_cutoff": "t-1 close",
                  "portfolio": "equal_weight_active_long_positions; zero weight inactive assets",
                  "rebalance_every_oos_observations": REBALANCE_EVERY,
                  "fee_rate": FEE,
                  "slippage_rate": SLIP,
                  "funding": "native settlement timestamps and native intervals",
                  "terminal_liquidation": True,
                  "parameters_fit_on_oos": False,
                  "no_parameter_grid": True
              },
              "oos_strategy": base,
              "benchmarks": {
                  "same_universe_equal_weight_long_only": benchmark_equal,
                  "BTCUSDT_buy_and_hold": benchmark_btc
              },
              "temporal_stability": halves,
              "cost_stress": cost_stress,
              "integrity": {
                  "fixed_universe": True,
                  "prior_only_price_signal": True,
                  "native_funding_timestamps_used": True,
                  "no_forward_fill": True,
                  "no_parameter_grid": True,
                  "no_post_hoc_parameter_search": True,
                  "no_universe_search": True,
                  "no_post_convergence_optimization": True,
                  "prior_experiments_modified": False,
                  "verified_cache_reused": True
              }
          }

          OUT.mkdir(parents=True, exist_ok=True)
          (OUT / "result.json").write_text(json.dumps(result, indent=2, sort_keys=True) + "\n")
          (OUT / "cache_manifest.json").write_text(json.dumps(
              [{"path": p, "sha256": h, "bytes": n} for p, h, n in sorted(cache_hashes)],
              indent=2, sort_keys=True
          ) + "\n")
          print(json.dumps(result, indent=2, sort_keys=True))
          PY

      - name: Upload FIN-0008 evidence
        uses: actions/upload-artifact@v4
        with:
          name: harmony-fin-0008-evidence
          path: artifacts/HARMONY-FIN-0008
          if-no-files-found: error
          retention-days: 90
