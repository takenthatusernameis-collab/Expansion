name: Harmony Technical 4h 025b
on:
  push:
    branches:
      - "research/grind-2026-10-01-tech4h"
    paths:
      - "research/HARMONY-TECH-4H-025.yaml"
      - "experiments/run_harmony_tech_4h_025.py"
      - "tests/test_harmony_tech_4h_025.py"
      - ".github/workflows/harmony-tech-4h-025b.yml"
permissions:
  contents: write

concurrency:
  group: harmony-tech-4h-025b
  cancel-in-progress: true
jobs:
  tech:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/grind-2026-10-01-tech4h
      - name: Install runtime
        run: python -m pip install --disable-pip-version-check --no-input pytest pandas==2.2.3 ta==0.11.0
      - name: Validate batch
        run: python -m pytest -q tests/test_harmony_tech_4h_025.py
      - name: Execute technical warehouse and 4h strategy funnel
        run: python experiments/run_harmony_tech_4h_025.py
      - uses: actions/upload-artifact@v4
        with:
          name: harmony-tech-4h-025b
          path: artifacts/HARMONY-TECH-4H-025
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: harmony-tech-4h-025b-indicators
          path: data/cache/harmony_gateway_v8/indicators_4h
          if-no-files-found: error
          retention-days: 90
      - name: Publish proof
        run: |
          mkdir -p research/execution_results
          cp artifacts/HARMONY-TECH-4H-025/SUMMARY.json research/execution_results/HARMONY-TECH-4H-025.json
          cp artifacts/HARMONY-TECH-4H-025/HARMONY-TECH-4H-025-RESULT.json research/execution_results/HARMONY-TECH-4H-025-RESULT.json
          cp artifacts/HARMONY-TECH-4H-025/INDICATOR-WAREHOUSE-MANIFEST.json research/execution_results/HARMONY-TECH-4H-025-INDICATOR-MANIFEST.json
          git config user.name "harmony-actions"
          git config user.email "harmony-actions@users.noreply.github.com"
          git add research/execution_results/HARMONY-TECH-4H-025.json research/execution_results/HARMONY-TECH-4H-025-RESULT.json research/execution_results/HARMONY-TECH-4H-025-INDICATOR-MANIFEST.json
          git diff --cached --quiet || (git commit -m "Publish 4h technical research proof" && git push)
