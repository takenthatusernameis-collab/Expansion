name: Harmony Deep Grind 003

on:
  push:
    paths:
      - "prompts/harmony_deep_grind_003.md"
      - "experiments/run_harmony_deep_grind_003.py"
      - "experiments/run_alpha_autopsy_v4.py"
      - ".github/workflows/harmony-deep-grind-003.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harmony-deep-grind-003
  cancel-in-progress: false

jobs:
  deep-grind:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - name: Restore verified monthly USD-M cache
        uses: actions/cache/restore@v4
        with:
          path: data/cache/binance/futures_um/monthly
          key: harmony-binance-um-2021-01-2025-10-v4
          fail-on-cache-miss: true

      - name: Restore verified futures deep-history cache
        uses: actions/cache/restore@v4
        with:
          path: data/cache/binance/futures_um/deep_history_2019
          key: harmony-binance-um-deep-history-2019-2025-10-v1-36777989764
          fail-on-cache-miss: true

      - name: Restore persistent funding feature store
        uses: actions/cache/restore@v4
        with:
          path: data/cache/features/funding_carry_v1
          key: harmony-feature-store-funding-carry-v1-2026-09-30-r1
          fail-on-cache-miss: true

      - name: Install test runner
        run: python -m pip install --disable-pip-version-check --no-input pytest

      - name: Validate Harmony Deep Grind 003 code and frozen component
        run: |
          python -m py_compile experiments/run_harmony_deep_grind_003.py experiments/run_alpha_autopsy_v3.py
          python -m pytest -q tests/test_deep_discovery_batch_007.py

      - name: Execute Harmony Deep Grind 003
        run: python experiments/run_harmony_deep_grind_003.py

      - name: Upload Deep Grind 003 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harmony-deep-grind-003
          path: |
            artifacts/HARMONY-DEEP-GRIND-003
            artifacts/HARMONY-FIN-0012-DURABILITY-V2
            artifacts/HARMONY-ALPHA-AUTOPSY-V2
            artifacts/HARMONY-CAMPAIGN-002
            artifacts/HARMONY-DEEP-DISCOVERY-BATCH-007
          if-no-files-found: warn
          retention-days: 90
