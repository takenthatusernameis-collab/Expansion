name: Harmony cross-sectional momentum OOS

on:
  push:
    paths:
      - "experiments/HARMONY-FIN-0003.yaml"
      - "experiments/run_harmony_fin_0003.py"
      - "experiments/run_harmony_infra_0007.py"
      - ".github/workflows/harmony-fin-0003.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore verified multi-asset archive cache
        uses: actions/cache@v4
        with:
          path: data/cache/binance/spot/monthly/klines_1d
          key: harmony-binance-spot-1d-2021-01-2025-10-v1
          fail-on-cache-miss: true

      - name: Run preregistered OOS experiment
        run: python experiments/run_harmony_fin_0003.py

      - name: Upload fixed OOS evidence
        uses: actions/upload-artifact@v4
        with:
          name: harmony-fin-0003-evidence
          path: artifacts/HARMONY-FIN-0003
          if-no-files-found: error
          retention-days: 90
