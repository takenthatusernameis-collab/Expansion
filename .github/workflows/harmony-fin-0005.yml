name: Harmony FIN-0005 funding-native OOS

on:
  push:
    paths:
      - "experiments/HARMONY-FIN-0005.yaml"
      - ".github/workflows/harmony-fin-0005.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore verified USD-M price and funding archives
        uses: actions/cache@v4
        with:
          path: data/cache/binance/futures_um/monthly
          key: harmony-binance-um-2021-01-2025-10-v4
          fail-on-cache-miss: true

      - name: Execute preregistered FIN-0005
        run: |
          python - <<'PY'
          import csv,io,json,math,statistics,zipfile
          from datetime import datetime,timezone
          from pathlib import Path

          S=["BTCUSDT","ETHUSDT","LTCUSDT","XRPUSDT","BNBUSDT","BCHUSDT","ADAUSDT","DOGEUSDT"]
          ROOT=Path("data/cache/binance/futures_um/monthly")
          LOOKBACK_DAYS=1
          FEE=.0006
          SLIP=.0005
          COST=FEE+SLIP
          OUT=Path("artifacts/HARMONY-FIN-0005")

          def day(ms):
              return datetime.fromtimestamp(ms/1000,timezone.utc).date().isoformat()
          def months():
              z=[];y,m=2021,1
              while (y,m)<=(2025,10):
                  z.append((y,m));m+=1
                  if m==13:y,m=y+1,1
              return z
          def rows(p):
              with zipfile.ZipFile(p) as z:
                  ns=[n for n in z.namelist() if n.lower().endswith(".csv")]
                  if len(ns)!=1: raise RuntimeError(f"bad archive {p}")
                  return list(csv.reader(io.StringIO(z.read(ns[0]).decode("utf-8"))))

          def load():
              px={s:{} for s in S}
              fd={s:[] for s in S}
              for s in S:
                  for y,m in months():
                      kp=ROOT/"klines"/s/"1d"/f"{s}-1d-{y:04d}-{m:02d}.zip"
                      fp=ROOT/"fundingRate"/s/f"{s}-fundingRate-{y:04d}-{m:02d}.zip"
                      for r in rows(kp):
                          if r and r[0].isdigit():
                              px[s][day(int(r[0]))]=float(r[4])
                      rr=rows(fp)
                      header=rr[0]
                      idx={k.strip():i for i,k in enumerate(header)}
                      required={"calc_time","funding_interval_hours","last_funding_rate"}
                      if not required.issubset(idx):
                          raise RuntimeError(f"funding schema mismatch: {fp}")
                      for r in rr[1:]:
                          if not r: continue
                          fd[s].append((
                              int(r[idx["calc_time"]]),
                              int(float(r[idx["funding_interval_hours"]])),
                              float(r[idx["last_funding_rate"]])
                          ))
              common=set.intersection(*(set(px[s]) for s in S))
              dates=sorted(common)
              if len(dates)!=1760 or dates[0]!="2021-01-01" or dates[-1]!="2025-10-31":
                  raise AssertionError("FIN-0005 data trace mismatch")
              return dates,px,fd

          def mean_prior_day_score(fd,s,d):
              if d not in fd[s]:
                  return None
              vals=[r for r in fd[s][d]]
              return statistics.mean(vals) if vals else None

          dates,px,rawfd=load()
          fd={s:{} for s in S}
          for s in S:
              for ts,interval,rate in rawfd[s]:
                  fd[s].setdefault(day(ts),[]).append(rate)

          def scores_for_prior_day(i):
              prior=dates[i-1]
              score_date=dates[i-1]
              vals=[]
              for s in S:
                  r=fd[s].get(score_date,[])
                  if not r:
                      vals.append((float("nan"),s))
                  else:
                      vals.append((statistics.mean(r),s))
              if any(math.isnan(v) for v,_ in vals):
                  raise AssertionError(f"missing prior-day funding score at {prior}")
              vals.sort(key=lambda z:(z[0],z[1]))
              return vals

          def target(i):
              if i<1:
                  return {s:0.0 for s in S}
              ranked=scores_for_prior_day(i)
              w={s:0.0 for s in S}
              for _,s in ranked[:2]:w[s]=.25
              for _,s in ranked[-2:]:w[s]=-.25
              return w

          def simulate(start,mode):
              by={s:{} for s in S}
              for s in S:
                  for ts,interval,rate in rawfd[s]:
                      by[s].setdefault(day(ts),[]).append(rate)
              eq=1.0;prev={s:0.0 for s in S};curve=[];fund_events=0;fund_sum=0.;cost_sum=0.;turn=0.
              for i in range(start,len(dates)):
                  d=dates[i]
                  for s in S:
                      for rate in by[s].get(d,[]):
                          eq*=1-prev[s]*rate
                          fund_sum+=-prev[s]*rate
                          fund_events+=1
                  if i>start:
                      pd=dates[i-1]
                      gross=sum(prev[s]*(px[s][d]/px[s][pd]-1.0) for s in S)
                      eq*=1+gross

                  if mode=="strategy":
                      tgt=target(i)
                  elif mode=="equal_weight":
                      tgt={s:1/len(S) for s in S}
                  elif mode=="btc":
                      tgt={s:(1.0 if s=="BTCUSDT" else 0.0) for s in S}
                  else:
                      raise ValueError(mode)

                  delta=sum(abs(tgt[s]-prev[s]) for s in S)
                  eq*=1-COST*delta
                  turn+=delta/2
                  cost_sum+=COST*delta
                  curve.append(eq)
                  prev=tgt

              liq=sum(abs(v) for v in prev.values())
              eq*=1-COST*liq
              curve[-1]=eq
              cost_sum+=COST*liq

              rr=[curve[i]/curve[i-1]-1 for i in range(1,len(curve))]
              sd=statistics.stdev(rr) if len(rr)>1 else 0
              sh=(statistics.mean(rr)/sd)*math.sqrt(365) if sd else 0
              peak=curve[0];mdd=0
              for x in curve:
                  peak=max(peak,x);mdd=min(mdd,x/peak-1)
              cagr=curve[-1]**(365.25/max(1,len(curve)-1))-1

              return {
                  "final_equity":eq,"cumulative_return":eq-1,"cagr":cagr,
                  "max_drawdown":mdd,"sharpe":sh,"observations":len(curve),
                  "total_one_way_turnover":turn,
                  "mean_daily_one_way_turnover":turn/len(curve),
                  "total_transaction_cost_fraction":cost_sum,
                  "funding_events":fund_events,
                  "funding_pnl_sum":fund_sum
              }

          split=math.floor(len(dates)*.70)
          oos=dates[split:]
          strategy=simulate(split,"strategy")
          equal_weight=simulate(split,"equal_weight")
          btc=simulate(split,"btc")

          OUT.mkdir(parents=True,exist_ok=True)
          result={
              "experiment_id":"HARMONY-FIN-0005",
              "strategy_id":"funding_contrarian_market_neutral",
              "data":{"panel_rows":len(dates),"panel_start":dates[0],"panel_end":dates[-1],
                      "oos_rows":len(oos),"oos_start":oos[0],"oos_end":oos[-1],"symbols":S},
              "configuration":{"signal":"mean_native_funding_rate_of_immediately_preceding_calendar_day",
                              "portfolio":"long_lowest_2_plus_0.25_each_short_highest_2_minus_0.25_each",
                              "fee_rate":FEE,"slippage_rate":SLIP,
                              "daily_rebalance":True,"parameters_fit_on_oos":False,
                              "native_funding_timestamps":True},
              "oos_strategy":strategy,
              "oos_equal_weight":equal_weight,
              "oos_btc":btc,
              "comparisons":{
                  "strategy_minus_equal_weight_cumulative_return":
                      strategy["cumulative_return"]-equal_weight["cumulative_return"],
                  "strategy_minus_btc_cumulative_return":
                      strategy["cumulative_return"]-btc["cumulative_return"]},
              "integrity":{
                  "fixed_universe":True,"prior_only_funding_signal":True,
                  "native_funding_timestamps_used":True,
                  "no_forward_fill":True,"no_universe_search":True,
                  "no_post_convergence_optimization":True,
                  "prior_experiments_modified":False}
          }
          (OUT/"result.json").write_text(json.dumps(result,indent=2,sort_keys=True)+"\n")
          print(json.dumps(result,indent=2,sort_keys=True))
          PY

      - name: Upload FIN-0005 evidence
        uses: actions/upload-artifact@v4
        with:
          name: harmony-fin-0005-evidence
          path: artifacts/HARMONY-FIN-0005
          if-no-files-found: error
          retention-days: 90
