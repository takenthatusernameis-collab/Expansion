name: Harmony external data gateway 002

on:
  push:
    paths:
      - "research/HARMONY-DATA-GATEWAY-002.yaml"
      - "data_sources/harmony_data_gateway_002.py"
      - "experiments/run_harmony_data_gateway_002.py"
      - "tests/test_harmony_data_gateway_002.py"
      - ".github/workflows/harmony-data-gateway-002.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gateway:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - name: Install runtime
        run: python -m pip install --disable-pip-version-check --no-input requests pytest
      - name: Validate gateway
        run: python -m pytest -q tests/test_harmony_data_gateway_002.py
      - name: Execute gateway 002
        run: python experiments/run_harmony_data_gateway_002.py
      - name: Cache lightweight data
        uses: actions/cache/save@v4
        with:
          path: data/cache/harmony_gateway_v2
          key: harmony-data-gateway-002-v1
      - name: Upload gateway evidence
        uses: actions/upload-artifact@v4
        with:
          name: harmony-data-gateway-002
          path: data/cache/harmony_gateway_v2
          if-no-files-found: error
          retention-days: 90
