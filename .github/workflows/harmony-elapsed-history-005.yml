name: Harmony elapsed historical tail materialization v5

on:
  schedule:
    - cron: "7 5 * * *"
  push:
    paths:
      - "research/HARMONY-ELAPSED-HISTORY-005.yaml"
      - "experiments/run_harmony_elapsed_history_005.py"
      - ".github/workflows/harmony-elapsed-history-005.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Materialize elapsed price plus public funding gateway
        run: python experiments/run_harmony_elapsed_history_005.py
      - name: Save elapsed historical cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: data/cache/binance/futures_um/elapsed_history_2026-09-daily-v5
          key: harmony-elapsed-history-2026-09-daily-v5-${{ github.run_id }}
      - name: Upload elapsed historical evidence
        uses: actions/upload-artifact@v4
        with:
          name: harmony-elapsed-history-005
          path: artifacts/HARMONY-ELAPSED-HISTORY-005
          if-no-files-found: error
          retention-days: 90
