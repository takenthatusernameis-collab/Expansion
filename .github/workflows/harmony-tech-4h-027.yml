name: Harmony Technical 4h fast 027
on:
  push:
    branches:
      - "research/grind-2026-10-01-tech4h-fast"
    paths:
      - "research/HARMONY-TECH-4H-027.yaml"
      - "experiments/run_harmony_tech_4h_027.py"
      - "tests/test_harmony_tech_4h_027.py"
      - ".github/workflows/harmony-tech-4h-027.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: harmony-tech-4h-027
  cancel-in-progress: true
jobs:
  tech:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/grind-2026-10-01-tech4h-fast
      - name: Install runtime
        run: python -m pip install --disable-pip-version-check --no-input pytest pandas==2.2.3 ta==0.11.0
      - name: Validate batch
        run: python -m pytest -q tests/test_harmony_tech_4h_027.py
      - name: Execute fast indicator and continuation screen
        run: python experiments/run_harmony_tech_4h_027.py
      - uses: actions/upload-artifact@v4
        with:
          name: harmony-tech-4h-027
          path: artifacts/HARMONY-TECH-4H-027
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: harmony-tech-4h-027-indicators
          path: data/cache/harmony_gateway_v8/indicators_4h_fast
          if-no-files-found: error
          retention-days: 90
      - name: Publish fast technical proof
        run: |
          mkdir -p research/execution_results
          cp artifacts/HARMONY-TECH-4H-027/SUMMARY.json research/execution_results/HARMONY-TECH-4H-027.json
          cp artifacts/HARMONY-TECH-4H-027/HARMONY-TECH-4H-027-RESULT.json research/execution_results/HARMONY-TECH-4H-027-RESULT.json
          cp artifacts/HARMONY-TECH-4H-027/INDICATOR-WAREHOUSE-MANIFEST.json research/execution_results/HARMONY-TECH-4H-027-INDICATOR-MANIFEST.json
          git config user.name "harmony-actions"
          git config user.email "harmony-actions@users.noreply.github.com"
          git add research/execution_results/HARMONY-TECH-4H-027.json research/execution_results/HARMONY-TECH-4H-027-RESULT.json research/execution_results/HARMONY-TECH-4H-027-INDICATOR-MANIFEST.json
          git diff --cached --quiet || (git commit -m "Publish fast 4h technical screen proof" && git push)
