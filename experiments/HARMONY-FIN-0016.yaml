experiment_id: HARMONY-FIN-0016
type: fixed_realized_signed_jump_oos
status: preregistered_frozen
strategy_id: realized_signed_jump_weekly_v1
objective: "Test whether realized signed jump risk contains cross-sectional forward-return information, consistent with attention-driven pricing of jump risk."
universe: [BTCUSDT,ETHUSDT,LTCUSDT,XRPUSDT,BNBUSDT,BCHUSDT,ADAUSDT,DOGEUSDT]
signal:
  intraday_bar: 5m
  jump_rule: "an intraday return is a jump when its absolute value exceeds 3.0 times the trailing 20-day same-time-scale standard deviation computed from prior completed 5m returns only"
  realized_signed_jump: "sum signed jump returns over the completed estimation window, divided by total realized variance over that same window"
  estimation_window: 20 common trading days
  score: "most recent completed 20-day realized signed-jump statistic"
  portfolio: "long top 3 and short bottom 3 assets by score; equal weight within each side; 0.5 gross per side; no trade when fewer than 6 assets have valid scores"
  rebalance: weekly
  tie_break: "symbol ascending"
  signal_cutoff: "all intraday observations complete through t-1"
costs:
  fee_rate: 0.0006
  slippage_rate: 0.0005
  funding: "recorded native funding events at their timestamps"
data:
  source_protocol: HARMONY-DEEP-HISTORY-2019-001
  additional_required_dataset: "verified five-minute Binance futures klines for the same universe and pre-OOS history"
  execution_history_end: "2025-10-31"
  holdout_access_forbidden: true
validation:
  discovery_boundary: "2024-05-21"
  oos_segment: "2024-05-22 through 2025-10-31"
  temporal_stability: "two equal chronological OOS halves"
  benchmarks: ["same-universe equal-weight long-only","BTCUSDT buy-and-hold"]
  cost_stress: ["1.0x","1.5x","2.0x"]
integrity:
  no_parameter_grid: true
  no_post_hoc_search: true
  no_candidate_mutation: true
  distinct_family_from: ["funding_carry","cross_sectional_momentum","time_series_momentum","liquidity_reversal","taker_flow"]
execution_gate:
  implementation_ready_only_after_five_minute_data_acquisition_and_fixture_validation: true
  candidate_definition_frozen: true
