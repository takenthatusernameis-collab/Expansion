experiment_id: HARMONY-FIN-0014
type: fixed_liquidity_conditioned_reversal_oos
status: preregistered_frozen
strategy_id: liquidity_conditioned_short_reversal_v1
objective: "Test whether short-term reversal is stronger in low-activity assets, consistent with a liquidity-provision/adverse-selection mechanism."
universe: [BTCUSDT,ETHUSDT,LTCUSDT,XRPUSDT,BNBUSDT,BCHUSDT,ADAUSDT,DOGEUSDT]
signal:
  return_lookback_days: 1
  volume_state: "asset quote-volume divided by trailing 20-common-day median quote-volume, using t-1 information"
  eligible_state: "volume_state < 1.0 at t-1"
  score: "-prior_1d_return"
  portfolio: "sort eligible assets by score, exclude one median asset when the eligible count is odd, long the upper half and short the lower half, equal weight within each side, 0.5 gross per side; no trade when fewer than 4 assets are eligible"
  rebalance: "weekly on every seventh signal-valid common observation, beginning at the first signal-valid observation"
  tie_break: "symbol ascending"
  signal_cutoff: "t-1 close and t-1 completed volume"
costs:
  fee_rate: 0.0006
  slippage_rate: 0.0005
  funding: "recorded native funding events at their timestamps"
data:
  source_protocol: HARMONY-DEEP-HISTORY-2019-001
  common_panel: "verified eight-symbol daily panel"
  execution_history_end: "2025-10-31"
  holdout_access_forbidden: true
validation:
  discovery_boundary: "2024-05-21"
  oos_segment: "2024-05-22 through 2025-10-31"
  temporal_stability: "two equal chronological OOS halves"
  benchmarks: ["same-universe equal-weight long-only","BTCUSDT buy-and-hold"]
  cost_stress: ["1.0x","1.5x","2.0x"]
integrity:
  no_parameter_grid: true
  no_post_hoc_search: true
  no_candidate_mutation: true
  distinct_family_from: ["funding_carry","cross_sectional_momentum","time_series_momentum"]
execution_gate:
  implementation_ready_after_deterministic_test: true
  candidate_definition_frozen: true
