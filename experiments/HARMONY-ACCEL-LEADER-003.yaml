experiment_id: HARMONY-ACCEL-LEADER-003
type: fixed_universe_crypto_spot_acceleration_momentum_with_atr_trailing_stop
status: preregistered
execution_repository: takenthatusernameis-collab/Expansion
tracking_repository: takenthatusernameis-collab/Contraction

preregistration_note: >-
  This separately preregistered candidate is a continuation of the failed-to-execute
  24-market Experiment 002 after its frozen EOS-USDT universe failed the live-market
  data gate. Experiment 003 substitutes OP-USDT before execution, then freezes the
  exact candidate list and its independently validated candle artifact. Experiment
  001 results informed this research direction, so all historical 60/20/20 metrics
  remain exploratory, not independent statistical confirmation. Any historical pass
  only permits a separately preregistered future-only paper trial.

hypothesis: >-
  On the frozen 24-market OKX spot panel, a fresh leader in volatility-normalized
  short-horizon return acceleration can generate more qualifying opportunities than
  the eight-market initial panel while retaining positive net expectancy after fees
  and stressed slippage, a positive high-cost Sharpe, better base-cost expectancy
  than the fresh 24-hour-gainer comparator, and positive net returns in both final
  out-of-sample halves. Any failed promotion gate falsifies the promotion claim.

universe_change:
  prior_blocked_experiment: HARMONY-ACCEL-LEADER-002
  prior_block_reason: EOS-USDT was not a live OKX spot instrument; no strategy metrics were produced
  explicit_change: replace EOS-USDT with OP-USDT before this experiment was preregistered
