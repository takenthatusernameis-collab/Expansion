experiment_id: "HARMONY-FIN-0001"
type: "fixed_baseline_oos"
status: "preregistered"
execution_repository: "takenthatusernameis-collab/Expansion"
tracking_repository: "takenthatusernameis-collab/Contraction"

objective: >
  Test whether a fixed BTC-USD daily SMA20/SMA50 long-only regime provides
  distinct out-of-sample behavior relative to buy-and-hold without optimizing
  the parameters on the evaluation segment.

hypothesis: >
  A prior-close SMA20 > SMA50 regime may reduce exposure during prolonged
  downtrends while retaining participation in sustained uptrends.

data:
  dataset_id: "HARMONY-DATA-BTCUSD-DAILY-2014-2025"
  sha256: "7bfbbcabb92b91898b67ed38bae71f4e50f2a37c636762703a3b9af08968343b"
  row_count: 4063
  timeframe: "1d"
  coverage: "2014-09-17 through 2025-10-31"
  encoding: "cp1252"

strategy:
  strategy_id: "BTC-SMA20x50-LONGONLY-V1"
  fast_window: 20
  slow_window: 50
  signal: "SMA20(t-1) > SMA50(t-1)"
  execution: "current daily close"
  fee_rate: 0.0006
  slippage_rate: 0.0005

validation:
  split: "chronological 70/30"
  oos_fraction: 0.30
  parameter_fitting_on_oos: false
  benchmark: "BTC buy-and-hold over identical OOS segment with identical round-trip costs"
  lookahead_control: "signal uses only prior daily close"
  independent_check: "core engine final cash must equal independent equity simulation"

outputs:
  - "experiment identity and deterministic digests"
  - "IS/OOS boundary"
  - "OOS cumulative return"
  - "OOS CAGR"
  - "OOS maximum drawdown"
  - "OOS Sharpe"
  - "OOS trade count"
  - "OOS profit factor"
  - "OOS buy-and-hold benchmark"
  - "strategy-minus-benchmark cumulative-return difference"
  - "integrity checks"

interpretation:
  - "This is exploratory baseline evidence, not live-trading evidence."
  - "No parameter search or post-hoc optimization is permitted within this experiment."
  - "A favorable OOS result does not by itself establish profitability in live trading."
