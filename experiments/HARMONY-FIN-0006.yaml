experiment_id: HARMONY-FIN-0006
type: fixed_cross_sectional_reversal_oos
status: preregistered
execution_repository: takenthatusernameis-collab/Expansion
tracking_repository: takenthatusernameis-collab/Contraction

strategy:
  strategy_id: cross_sectional_reversal_1d_top2_bottom2
  universe: [BTCUSDT,ETHUSDT,LTCUSDT,XRPUSDT,BNBUSDT,BCHUSDT,ADAUSDT,DOGEUSDT]
  score: "prior completed daily close-to-close return from t-2 to t-1"
  portfolio_rule_ref: "tracking/convergence/HARMONY-CONVERGENCE-SCOPE-0010.yaml"
  rebalance: daily_at_close
  signal_cutoff: t_minus_1_close
  fee_rate: 0.0006
  slippage_rate: 0.0005
  turnover_cost: "(fee + slippage) * sum(abs(target_weight - prior_weight))"
  funding: "apply native funding settlement to the position held immediately before settlement using calc_time and funding_interval_hours"
  terminal_liquidation: true

data:
